name: Architecture Check

on:
  push:
    branches: [main]
    paths: ["ost_visualizer/**/*.py", "tools/check_architecture.py"]
  pull_request:
    paths: ["ost_visualizer/**/*.py", "tools/check_architecture.py"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run architecture checks
        run: python tools/check_architecture.py
