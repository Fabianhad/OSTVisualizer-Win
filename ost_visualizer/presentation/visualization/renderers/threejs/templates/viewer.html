<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a1a1a;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #pdf-toggle {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 10;
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font: 13px sans-serif;
        }

        #pdf-toggle:hover {
            background: #444;
        }

        #pdf-toggle.active {
            background: #00796b;
            color: #fff;
            border-color: #00897b;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <button id="pdf-toggle" style="display:none;">Show Plan</button>
    <script type="application/json" id="scene-data">
{{SCENE_DATA}}
    </script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/",
            "three-wboit": "https://unpkg.com/three-wboit@1.0.8/src/index.js",
            "three-wboit/": "https://unpkg.com/three-wboit@1.0.8/src/"
        }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { WboitPass } from 'three-wboit';
        import { MeshWboitMaterial } from 'three-wboit';

        const sceneData = JSON.parse(document.getElementById('scene-data').textContent);
        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x1a1a1a);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.5;

        const scene = new THREE.Scene();
        const pdfBase64 = sceneData.pdf_base64 || null;
        const pdfPageIndex = sceneData.pdf_page_index || 0;
        const pageW = Number(sceneData.page_width || 0);
        const pageH = Number(sceneData.page_height || 0);

        function readVector3(values, fallback) {
            if (Array.isArray(values) && values.length >= 3) {
                const x = Number(values[0]);
                const y = Number(values[1]);
                const z = Number(values[2]);
                if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)) {
                    return new THREE.Vector3(x, y, z);
                }
            }
            return fallback.clone();
        }

        function getBoxCorners(box) {
            const min = box.min;
            const max = box.max;
            return [
                new THREE.Vector3(min.x, min.y, min.z),
                new THREE.Vector3(min.x, min.y, max.z),
                new THREE.Vector3(min.x, max.y, min.z),
                new THREE.Vector3(min.x, max.y, max.z),
                new THREE.Vector3(max.x, min.y, min.z),
                new THREE.Vector3(max.x, min.y, max.z),
                new THREE.Vector3(max.x, max.y, min.z),
                new THREE.Vector3(max.x, max.y, max.z),
            ];
        }

        function buildClippingBounds(center, radius, box) {
            const depthPadding = Math.max(radius * 0.05, 1.0);
            const nearBoxPadding = Math.max(radius * 0.02, 0.5);
            const depthBox = box.clone().expandByScalar(depthPadding);
            const nearBox = box.clone().expandByScalar(nearBoxPadding);
            return {
                center: center,
                radius: radius,
                minNear: Math.max(radius / 10000.0, 0.01),
                box: box,
                depthPadding: depthPadding,
                nearBox: nearBox,
                depthCorners: getBoxCorners(depthBox),
            };
        }

        function getPagePlaneBox(pageWidth, pageHeight, modelBox) {
            if (!(pageWidth > 0.0 && pageHeight > 0.0)) {
                return null;
            }

            const pagePadding = Math.max(Math.max(pageWidth, pageHeight) * 0.001, 0.05);
            const floorY = modelBox ? modelBox.min.y - 0.01 : -0.01;
            return new THREE.Box3(
                new THREE.Vector3(-pageWidth, floorY - pagePadding, -pageHeight),
                new THREE.Vector3(0.0, floorY + pagePadding, 0.0)
            );
        }

        function getSceneClippingBounds(bounds, pageWidth, pageHeight) {
            const fallbackCenter = readVector3(sceneData.camera && sceneData.camera.target, new THREE.Vector3());
            const fallbackRadius = 1000.0;
            const fallbackBox = new THREE.Box3(
                new THREE.Vector3(
                    fallbackCenter.x - fallbackRadius,
                    fallbackCenter.y - fallbackRadius,
                    fallbackCenter.z - fallbackRadius
                ),
                new THREE.Vector3(
                    fallbackCenter.x + fallbackRadius,
                    fallbackCenter.y + fallbackRadius,
                    fallbackCenter.z + fallbackRadius
                )
            );
            const buildFromBox = (box) => {
                const pageBox = getPagePlaneBox(pageWidth, pageHeight, box);
                const clippingBox = pageBox ? box.clone().union(pageBox) : box;
                const sphere = new THREE.Sphere();
                clippingBox.getBoundingSphere(sphere);
                const radius = Math.max(sphere.radius, 1.0);
                return buildClippingBounds(sphere.center, radius, clippingBox);
            };

            if (!bounds || !bounds.min || !bounds.max) {
                return buildFromBox(fallbackBox);
            }

            const min = readVector3(bounds.min, fallbackCenter);
            const max = readVector3(bounds.max, fallbackCenter);
            if (min.x > max.x || min.y > max.y || min.z > max.z) {
                return buildFromBox(fallbackBox);
            }

            const box = new THREE.Box3(min, max);
            return buildFromBox(box);
        }

        const sceneClippingBounds = getSceneClippingBounds(sceneData.bounds, pageW, pageH);
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            sceneClippingBounds.minNear,
            sceneClippingBounds.radius * 10.0
        );
        camera.position.set(
            sceneData.camera.position[0],
            sceneData.camera.position[1],
            sceneData.camera.position[2]
        );

        const controls = new OrbitControls(camera, canvas);
        controls.target.set(
            sceneData.camera.target[0],
            sceneData.camera.target[1],
            sceneData.camera.target[2]
        );
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = Math.max(sceneClippingBounds.radius * 100.0, 1.0);
        controls.update();

        function getSceneDepthRange() {
            if (sceneClippingBounds.nearBox.containsPoint(camera.position)) {
                return null;
            }

            const viewDirection = new THREE.Vector3();
            camera.getWorldDirection(viewDirection);
            let nearest = Infinity;
            let farthest = 0.0;
            let cornersBehindCamera = 0;

            for (const corner of sceneClippingBounds.depthCorners) {
                const depth = corner.clone().sub(camera.position).dot(viewDirection);
                if (depth <= sceneClippingBounds.minNear) {
                    cornersBehindCamera += 1;
                } else {
                    nearest = Math.min(nearest, depth);
                    farthest = Math.max(farthest, depth);
                }
            }

            if (
                cornersBehindCamera > 0
                || !Number.isFinite(nearest)
                || farthest <= 0.0
                || nearest <= sceneClippingBounds.depthPadding
            ) {
                return null;
            }
            return { nearest: nearest, farthest: farthest };
        }

        function updateCameraClipping(force = false) {
            const baseNear = sceneClippingBounds.minNear;
            const depthRange = getSceneDepthRange();
            let nextNear;
            let nextFar;

            if (depthRange) {
                nextNear = Math.max(baseNear, depthRange.nearest - sceneClippingBounds.depthPadding);
                nextFar = Math.max(
                    nextNear + sceneClippingBounds.radius * 0.25,
                    depthRange.farthest + sceneClippingBounds.depthPadding,
                    nextNear + 1.0
                );
            } else {
                const distanceToCenter = camera.position.distanceTo(sceneClippingBounds.center);
                const outsideNear = distanceToCenter - sceneClippingBounds.radius * 1.5;
                nextNear = Math.max(baseNear, outsideNear);
                nextFar = Math.max(
                    nextNear + sceneClippingBounds.radius * 3.0,
                    distanceToCenter + sceneClippingBounds.radius * 1.5
                );
            }

            const nearDelta = Math.abs(camera.near - nextNear);
            const farDelta = Math.abs(camera.far - nextFar);
            const nearThreshold = Math.max(nextNear * 0.001, 0.001);
            const farThreshold = Math.max(nextFar * 0.001, 0.01);

            if (force || nearDelta > nearThreshold || farDelta > farThreshold) {
                camera.near = nextNear;
                camera.far = nextFar;
                camera.updateProjectionMatrix();
            }
        }

        updateCameraClipping(true);

        scene.add(new THREE.AmbientLight(0xffffff, 0.35));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(500, 500, -500);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
        fillLight.position.set(-500, 500, 500);
        scene.add(fillLight);
        const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
        rimLight.position.set(0, -500, -500);
        scene.add(rimLight);

        let hasTransparent = false;

        sceneData.geometries.forEach(geomData => {
            if (geomData.opacity < 1.0) hasTransparent = true;
        });

        const wboitPass = hasTransparent
            ? new WboitPass(renderer, scene, camera, new THREE.Color(0x1a1a1a), 1.0)
            : null;

        sceneData.geometries.forEach(geomData => {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(geomData.vertices), 3));
            if (geomData.normals && geomData.normals.length > 0) {
                geometry.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(geomData.normals), 3));
            }
            geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(geomData.indices), 1));
            const color = new THREE.Color(geomData.color[0], geomData.color[1], geomData.color[2]);
            const isTransparent = geomData.opacity < 1.0;

            if (isTransparent && wboitPass) {
                const material = new MeshWboitMaterial({
                    color: color,
                    opacity: geomData.opacity,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    weight: 1.0,
                });
                scene.add(new THREE.Mesh(geometry, material));
            } else {
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    opacity: geomData.opacity,
                    transparent: isTransparent,
                    side: THREE.DoubleSide,
                    depthWrite: !isTransparent,
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.renderOrder = isTransparent ? 1 : 0;
                scene.add(mesh);
            }
        });

        const pdfToggle = document.getElementById('pdf-toggle');
        let pdfPlane = null;

        if (pdfBase64 && pageW > 0 && pageH > 0 && typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const pdfData = atob(pdfBase64);
            const pdfArray = new Uint8Array(pdfData.length);
            for (let i = 0; i < pdfData.length; i++) pdfArray[i] = pdfData.charCodeAt(i);

            pdfjsLib.getDocument({ data: pdfArray }).promise.then(doc => {
                return doc.getPage(Math.min(pdfPageIndex + 1, doc.numPages));
            }).then(page => {
                const vp = page.getViewport({ scale: 3.0 });
                const off = document.createElement('canvas');
                off.width = vp.width; off.height = vp.height;
                const ctx = off.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, vp.width, vp.height);
                return page.render({ canvasContext: ctx, viewport: vp }).promise.then(() => off);
            }).then(off => {
                const tex = new THREE.CanvasTexture(off);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                const geo = new THREE.PlaneGeometry(pageW, pageH);
                pdfPlane = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
                pdfPlane.rotation.x = -Math.PI / 2;
                const floorY = sceneData.bounds ? sceneData.bounds.min[1] - 0.01 : -0.01;
                pdfPlane.position.set(-pageW / 2, floorY, -pageH / 2);
                const uv = geo.attributes.uv;
                for (let i = 0; i < uv.count; i++) { uv.setX(i, 1 - uv.getX(i)); uv.setY(i, 1 - uv.getY(i)); }
                uv.needsUpdate = true;
                pdfPlane.renderOrder = -1;
                pdfToggle.style.display = 'block';
            }).catch(e => console.warn('PDF floor failed:', e));

            pdfToggle.addEventListener('click', () => {
                if (!pdfPlane) return;
                const showing = pdfPlane.parent === scene;
                if (showing) {
                    scene.remove(pdfPlane);
                } else {
                    scene.add(pdfPlane);
                }
                pdfToggle.textContent = !showing ? 'Hide Plan' : 'Show Plan';
                pdfToggle.classList.toggle('active', !showing);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateCameraClipping();
            if (wboitPass) {
                wboitPass.render(renderer);
            } else {
                renderer.render(scene, camera);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            updateCameraClipping(true);
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (wboitPass) wboitPass.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
