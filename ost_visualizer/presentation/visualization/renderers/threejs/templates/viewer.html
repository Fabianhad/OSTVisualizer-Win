<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        :root {
            --viewer-surface: rgba(15, 15, 21, 0.92);
            --viewer-border: rgba(255, 255, 255, 0.08);
            --viewer-divider: rgba(255, 255, 255, 0.06);
            --viewer-control-border: rgba(255, 255, 255, 0.1);
            --viewer-swatch-border: rgba(255, 255, 255, 0.15);
            --viewer-scrollbar: rgba(255, 255, 255, 0.1);
            --viewer-control-bg: rgba(255, 255, 255, 0.03);
            --viewer-hover-bg: rgba(255, 255, 255, 0.06);
            --viewer-text: #e2e8f0;
            --viewer-muted: #8892b0;
            --viewer-accent: #4a9eff;
            --viewer-disabled: #555;
            --viewer-radius: 10px;
            --viewer-radius-sm: 6px;
            --viewer-safe-top: env(safe-area-inset-top, 0px);
            --viewer-safe-right: env(safe-area-inset-right, 0px);
            --viewer-safe-bottom: env(safe-area-inset-bottom, 0px);
            --viewer-safe-left: env(safe-area-inset-left, 0px);
        }

        html[data-theme="light"] {
            --viewer-surface: rgba(255, 255, 255, 0.92);
            --viewer-border: rgba(15, 23, 42, 0.12);
            --viewer-divider: rgba(15, 23, 42, 0.08);
            --viewer-control-border: rgba(15, 23, 42, 0.14);
            --viewer-swatch-border: rgba(15, 23, 42, 0.2);
            --viewer-scrollbar: rgba(15, 23, 42, 0.18);
            --viewer-control-bg: rgba(15, 23, 42, 0.04);
            --viewer-hover-bg: rgba(15, 23, 42, 0.07);
            --viewer-text: #121826;
            --viewer-muted: #5f6f86;
            --viewer-accent: #2563eb;
            --viewer-disabled: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: #1a1a1a;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: block;
        }

        #layer-panel {
            position: fixed;
            top: calc(12px + var(--viewer-safe-top));
            left: calc(12px + var(--viewer-safe-left));
            z-index: 10;
            background: var(--viewer-surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--viewer-border);
            border-radius: var(--viewer-radius);
            color: var(--viewer-text);
            font-size: 13px;
            min-width: 200px;
            max-width: 280px;
            max-height: calc(100dvh - 24px - var(--viewer-safe-top) - var(--viewer-safe-bottom));
            display: none;
            flex-direction: column;
            user-select: none;
        }

        #layer-panel.visible {
            display: flex;
        }

        #layer-panel.collapsed #layer-list,
        #layer-panel.collapsed #layer-actions {
            display: none;
        }

        #layer-panel.collapsed {
            min-width: 0;
        }

        #layer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            border-bottom: 1px solid var(--viewer-divider);
        }

        #layer-panel.collapsed #layer-header {
            border-bottom: none;
            border-radius: var(--viewer-radius);
        }

        #layer-count {
            font-size: 11px;
            color: var(--viewer-muted);
        }

        #layer-actions {
            display: flex;
            gap: 6px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--viewer-divider);
        }

        #layer-actions button {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid var(--viewer-control-border);
            border-radius: var(--viewer-radius-sm);
            background: var(--viewer-control-bg);
            color: var(--viewer-muted);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
        }

        #layer-actions button:hover {
            background: var(--viewer-hover-bg);
            color: var(--viewer-text);
        }

        #layer-list {
            overflow-y: auto;
            padding: 4px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--viewer-scrollbar) transparent;
        }

        .layer-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .layer-row:hover {
            background: var(--viewer-hover-bg);
        }

        .layer-row input[type="checkbox"] {
            accent-color: var(--viewer-accent);
            width: 14px;
            height: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .layer-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
            border: 1px solid var(--viewer-swatch-border);
            background: var(--viewer-muted);
        }

        .layer-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .layer-row.disabled .layer-name {
            color: var(--viewer-disabled);
            text-decoration: line-through;
        }

        @media (max-width: 480px) {
            #layer-panel {
                top: calc(8px + var(--viewer-safe-top));
                left: calc(8px + var(--viewer-safe-left));
                right: calc(8px + var(--viewer-safe-right));
                min-width: 0;
                max-width: none;
                font-size: 12px;
                max-height: min(50dvh, calc(100dvh - 16px - var(--viewer-safe-top) - var(--viewer-safe-bottom)));
            }

            #layer-header {
                padding: 10px 12px;
            }

            #layer-actions {
                padding: 6px 12px;
            }

            #layer-actions button {
                padding: 8px 6px;
                font-size: 12px;
                min-height: 36px;
            }

            .layer-row {
                padding: 8px 12px;
                gap: 10px;
                min-height: 40px;
            }

            .layer-row input[type="checkbox"] {
                width: 18px;
                height: 18px;
            }

            .layer-swatch {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>

<body>
    <div id="layer-panel" class="collapsed">
        <div id="layer-header">
            <span>Layers</span>
            <span id="layer-count"></span>
        </div>
        <div id="layer-actions">
            <button type="button" id="layer-show-all">Show All</button>
            <button type="button" id="layer-hide-all">Hide All</button>
        </div>
        <div id="layer-list"></div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="application/json" id="scene-data">
{{SCENE_DATA}}
    </script>
    <script>
        (function () {
            var theme = window.matchMedia
                && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
            try {
                var storedTheme = localStorage.getItem('fabian-theme');
                if (storedTheme === 'light' || storedTheme === 'dark') theme = storedTheme;
            } catch (_) { }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/",
            "three-wboit": "https://unpkg.com/three-wboit@1.0.8/src/index.js",
            "three-wboit/": "https://unpkg.com/three-wboit@1.0.8/src/"
        }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { WboitPass } from 'three-wboit';
        import { MeshWboitMaterial } from 'three-wboit';

        const sceneData = JSON.parse(document.getElementById('scene-data').textContent);
        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x1a1a1a);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.5;

        const scene = new THREE.Scene();
        const pdfBase64 = sceneData.pdf_base64 || null;
        const pdfPageIndex = sceneData.pdf_page_index || 0;
        const pageW = Number(sceneData.page_width || 0);
        const pageH = Number(sceneData.page_height || 0);
        const layerPanel = document.getElementById('layer-panel');
        const layerList = document.getElementById('layer-list');
        const layerCount = document.getElementById('layer-count');
        const layerHeader = document.getElementById('layer-header');
        const layerShowAll = document.getElementById('layer-show-all');
        const layerHideAll = document.getElementById('layer-hide-all');
        const layerRegistry = new Map();
        const layerObjects = new Map();
        const layerRows = new Map();
        const UNLAYERED_UID = '__unlayered__';

        function normalizeLayerUid(layerUid) {
            const uid = layerUid === undefined || layerUid === null ? '' : String(layerUid);
            return uid || UNLAYERED_UID;
        }

        function colorArrayToHex(color) {
            if (!Array.isArray(color) || color.length < 3) {
                return '#8892b0';
            }
            const parts = color.slice(0, 3).map(value => {
                const channel = Math.max(0, Math.min(255, Math.round(Number(value) * 255)));
                return channel.toString(16).padStart(2, '0');
            });
            return `#${parts.join('')}`;
        }

        function ensureLayerEntry(layerUid, name, visible = true, color = '#8892b0') {
            const uid = normalizeLayerUid(layerUid);
            if (!layerRegistry.has(uid)) {
                layerRegistry.set(uid, {
                    uid: uid,
                    name: name || (uid === UNLAYERED_UID ? 'Unlayered' : uid),
                    visible: visible !== false,
                    color: color,
                    objects: [],
                });
            } else {
                const entry = layerRegistry.get(uid);
                if (name && entry.name === uid) entry.name = name;
                if (color && entry.color === '#8892b0') entry.color = color;
            }
            if (!layerObjects.has(uid)) {
                layerObjects.set(uid, []);
            }
            return layerRegistry.get(uid);
        }

        function buildLayerRegistry() {
            const layers = Array.isArray(sceneData.layers) ? sceneData.layers : [];
            layers.forEach(layer => {
                ensureLayerEntry(layer.uid, layer.name, layer.visible, layer.color || '#8892b0');
            });
            if (sceneData.page_image_layer) {
                const layer = sceneData.page_image_layer;
                const pageEntry = ensureLayerEntry(
                    layer.uid,
                    layer.name || 'Image',
                    layer.visible,
                    '#ffffff'
                );
                pageEntry.visible = layer.visible !== false;
            }
        }

        function registerLayerObject(layerUid, object, baseVisible = true) {
            const uid = normalizeLayerUid(layerUid);
            ensureLayerEntry(uid);
            object.userData.layerUid = uid;
            object.userData.baseVisible = baseVisible !== false;
            layerObjects.get(uid).push(object);
            applyLayerVisibility(uid);
        }

        function applyLayerVisibility(layerUid) {
            const uid = normalizeLayerUid(layerUid);
            const entry = layerRegistry.get(uid);
            const layerVisible = entry ? entry.visible : true;
            const objects = layerObjects.get(uid) || [];
            objects.forEach(object => {
                object.visible = object.userData.baseVisible !== false && layerVisible;
            });
            const row = layerRows.get(uid);
            if (row) {
                row.classList.toggle('disabled', !layerVisible);
                const checkbox = row.querySelector('input[type="checkbox"]');
                if (checkbox) checkbox.checked = layerVisible;
            }
        }

        function setLayerVisible(layerUid, visible) {
            const uid = normalizeLayerUid(layerUid);
            const entry = layerRegistry.get(uid);
            if (!entry) return;
            entry.visible = Boolean(visible);
            applyLayerVisibility(uid);
        }

        function setAllLayersVisible(visible) {
            for (const uid of layerRegistry.keys()) {
                setLayerVisible(uid, visible);
            }
        }

        function buildLayerPanel() {
            layerList.innerHTML = '';
            layerRows.clear();
            const entries = Array.from(layerRegistry.values());
            if (!entries.length) {
                layerPanel.classList.remove('visible');
                return;
            }
            layerCount.textContent = String(entries.length);
            layerPanel.classList.add('visible');

            entries.forEach(entry => {
                const row = document.createElement('label');
                row.className = 'layer-row';
                row.title = entry.name;
                row.classList.toggle('disabled', !entry.visible);

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = entry.visible;
                checkbox.addEventListener('change', () => {
                    setLayerVisible(entry.uid, checkbox.checked);
                });

                const swatch = document.createElement('div');
                swatch.className = 'layer-swatch';
                swatch.style.background = entry.color;

                const name = document.createElement('span');
                name.className = 'layer-name';
                name.textContent = entry.name;

                row.append(checkbox, swatch, name);
                layerList.appendChild(row);
                layerRows.set(entry.uid, row);
            });
        }

        buildLayerRegistry();
        layerHeader.addEventListener('click', () => layerPanel.classList.toggle('collapsed'));
        layerShowAll.addEventListener('click', () => setAllLayersVisible(true));
        layerHideAll.addEventListener('click', () => setAllLayersVisible(false));
        window.toggleAll = setAllLayersVisible;

        function readVector3(values, fallback) {
            if (Array.isArray(values) && values.length >= 3) {
                const x = Number(values[0]);
                const y = Number(values[1]);
                const z = Number(values[2]);
                if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)) {
                    return new THREE.Vector3(x, y, z);
                }
            }
            return fallback.clone();
        }

        function getBoxCorners(box) {
            const min = box.min;
            const max = box.max;
            return [
                new THREE.Vector3(min.x, min.y, min.z),
                new THREE.Vector3(min.x, min.y, max.z),
                new THREE.Vector3(min.x, max.y, min.z),
                new THREE.Vector3(min.x, max.y, max.z),
                new THREE.Vector3(max.x, min.y, min.z),
                new THREE.Vector3(max.x, min.y, max.z),
                new THREE.Vector3(max.x, max.y, min.z),
                new THREE.Vector3(max.x, max.y, max.z),
            ];
        }

        function buildClippingBounds(center, radius, box) {
            const depthPadding = Math.max(radius * 0.05, 1.0);
            const nearBoxPadding = Math.max(radius * 0.02, 0.5);
            const depthBox = box.clone().expandByScalar(depthPadding);
            const nearBox = box.clone().expandByScalar(nearBoxPadding);
            return {
                center: center,
                radius: radius,
                minNear: Math.max(radius / 10000.0, 0.01),
                box: box,
                depthPadding: depthPadding,
                nearBox: nearBox,
                depthCorners: getBoxCorners(depthBox),
            };
        }

        function getPagePlaneBox(pageWidth, pageHeight, modelBox) {
            if (!(pageWidth > 0.0 && pageHeight > 0.0)) {
                return null;
            }

            const pagePadding = Math.max(Math.max(pageWidth, pageHeight) * 0.001, 0.05);
            const floorY = modelBox ? modelBox.min.y - 0.01 : -0.01;
            return new THREE.Box3(
                new THREE.Vector3(-pageWidth, floorY - pagePadding, -pageHeight),
                new THREE.Vector3(0.0, floorY + pagePadding, 0.0)
            );
        }

        function getSceneClippingBounds(bounds, pageWidth, pageHeight) {
            const fallbackCenter = readVector3(sceneData.camera && sceneData.camera.target, new THREE.Vector3());
            const fallbackRadius = 1000.0;
            const fallbackBox = new THREE.Box3(
                new THREE.Vector3(
                    fallbackCenter.x - fallbackRadius,
                    fallbackCenter.y - fallbackRadius,
                    fallbackCenter.z - fallbackRadius
                ),
                new THREE.Vector3(
                    fallbackCenter.x + fallbackRadius,
                    fallbackCenter.y + fallbackRadius,
                    fallbackCenter.z + fallbackRadius
                )
            );
            const buildFromBox = (box) => {
                const pageBox = getPagePlaneBox(pageWidth, pageHeight, box);
                const clippingBox = pageBox ? box.clone().union(pageBox) : box;
                const sphere = new THREE.Sphere();
                clippingBox.getBoundingSphere(sphere);
                const radius = Math.max(sphere.radius, 1.0);
                return buildClippingBounds(sphere.center, radius, clippingBox);
            };

            if (!bounds || !bounds.min || !bounds.max) {
                return buildFromBox(fallbackBox);
            }

            const min = readVector3(bounds.min, fallbackCenter);
            const max = readVector3(bounds.max, fallbackCenter);
            if (min.x > max.x || min.y > max.y || min.z > max.z) {
                return buildFromBox(fallbackBox);
            }

            const box = new THREE.Box3(min, max);
            return buildFromBox(box);
        }

        const sceneClippingBounds = getSceneClippingBounds(sceneData.bounds, pageW, pageH);
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            sceneClippingBounds.minNear,
            sceneClippingBounds.radius * 10.0
        );
        camera.position.set(
            sceneData.camera.position[0],
            sceneData.camera.position[1],
            sceneData.camera.position[2]
        );

        const controls = new OrbitControls(camera, canvas);
        controls.target.set(
            sceneData.camera.target[0],
            sceneData.camera.target[1],
            sceneData.camera.target[2]
        );
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = Math.max(sceneClippingBounds.radius * 100.0, 1.0);
        controls.update();

        function getSceneDepthRange() {
            if (sceneClippingBounds.nearBox.containsPoint(camera.position)) {
                return null;
            }

            const viewDirection = new THREE.Vector3();
            camera.getWorldDirection(viewDirection);
            let nearest = Infinity;
            let farthest = 0.0;
            let cornersBehindCamera = 0;

            for (const corner of sceneClippingBounds.depthCorners) {
                const depth = corner.clone().sub(camera.position).dot(viewDirection);
                if (depth <= sceneClippingBounds.minNear) {
                    cornersBehindCamera += 1;
                } else {
                    nearest = Math.min(nearest, depth);
                    farthest = Math.max(farthest, depth);
                }
            }

            if (
                cornersBehindCamera > 0
                || !Number.isFinite(nearest)
                || farthest <= 0.0
                || nearest <= sceneClippingBounds.depthPadding
            ) {
                return null;
            }
            return { nearest: nearest, farthest: farthest };
        }

        function updateCameraClipping(force = false) {
            const baseNear = sceneClippingBounds.minNear;
            const depthRange = getSceneDepthRange();
            let nextNear;
            let nextFar;

            if (depthRange) {
                nextNear = Math.max(baseNear, depthRange.nearest - sceneClippingBounds.depthPadding);
                nextFar = Math.max(
                    nextNear + sceneClippingBounds.radius * 0.25,
                    depthRange.farthest + sceneClippingBounds.depthPadding,
                    nextNear + 1.0
                );
            } else {
                const distanceToCenter = camera.position.distanceTo(sceneClippingBounds.center);
                const outsideNear = distanceToCenter - sceneClippingBounds.radius * 1.5;
                nextNear = Math.max(baseNear, outsideNear);
                nextFar = Math.max(
                    nextNear + sceneClippingBounds.radius * 3.0,
                    distanceToCenter + sceneClippingBounds.radius * 1.5
                );
            }

            const nearDelta = Math.abs(camera.near - nextNear);
            const farDelta = Math.abs(camera.far - nextFar);
            const nearThreshold = Math.max(nextNear * 0.001, 0.001);
            const farThreshold = Math.max(nextFar * 0.001, 0.01);

            if (force || nearDelta > nearThreshold || farDelta > farThreshold) {
                camera.near = nextNear;
                camera.far = nextFar;
                camera.updateProjectionMatrix();
            }
        }

        updateCameraClipping(true);

        scene.add(new THREE.AmbientLight(0xffffff, 0.35));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(500, 500, -500);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
        fillLight.position.set(-500, 500, 500);
        scene.add(fillLight);
        const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
        rimLight.position.set(0, -500, -500);
        scene.add(rimLight);

        let hasTransparent = false;

        sceneData.geometries.forEach(geomData => {
            if (geomData.opacity < 1.0) hasTransparent = true;
        });

        const wboitPass = hasTransparent
            ? new WboitPass(renderer, scene, camera, new THREE.Color(0x1a1a1a), 1.0)
            : null;

        sceneData.geometries.forEach(geomData => {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(geomData.vertices), 3));
            if (geomData.normals && geomData.normals.length > 0) {
                geometry.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(geomData.normals), 3));
            }
            geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(geomData.indices), 1));
            const color = new THREE.Color(geomData.color[0], geomData.color[1], geomData.color[2]);
            const isTransparent = geomData.opacity < 1.0;
            const layerUid = normalizeLayerUid(geomData.layer_uid);
            ensureLayerEntry(layerUid, geomData.layer_name || geomData.name, true, colorArrayToHex(geomData.color));
            let mesh;

            if (isTransparent && wboitPass) {
                const material = new MeshWboitMaterial({
                    color: color,
                    opacity: geomData.opacity,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    weight: 1.0,
                });
                mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);
            } else {
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    opacity: geomData.opacity,
                    transparent: isTransparent,
                    side: THREE.DoubleSide,
                    depthWrite: !isTransparent,
                });
                mesh = new THREE.Mesh(geometry, material);
                mesh.renderOrder = isTransparent ? 1 : 0;
                scene.add(mesh);
            }
            mesh.userData.conditionUid = geomData.condition_uid || '';
            mesh.userData.takeoffUid = geomData.takeoff_uid || '';
            registerLayerObject(layerUid, mesh, geomData.visible !== false);
        });

        let pdfPlane = null;
        buildLayerPanel();

        if (pdfBase64 && pageW > 0 && pageH > 0 && typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const pdfData = atob(pdfBase64);
            const pdfArray = new Uint8Array(pdfData.length);
            for (let i = 0; i < pdfData.length; i++) pdfArray[i] = pdfData.charCodeAt(i);

            pdfjsLib.getDocument({ data: pdfArray }).promise.then(doc => {
                return doc.getPage(Math.min(pdfPageIndex + 1, doc.numPages));
            }).then(page => {
                const vp = page.getViewport({ scale: 3.0 });
                const off = document.createElement('canvas');
                off.width = vp.width; off.height = vp.height;
                const ctx = off.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, vp.width, vp.height);
                return page.render({ canvasContext: ctx, viewport: vp }).promise.then(() => off);
            }).then(off => {
                const tex = new THREE.CanvasTexture(off);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                const geo = new THREE.PlaneGeometry(pageW, pageH);
                pdfPlane = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
                pdfPlane.rotation.x = -Math.PI / 2;
                const floorY = sceneData.bounds ? sceneData.bounds.min[1] - 0.01 : -0.01;
                pdfPlane.position.set(-pageW / 2, floorY, -pageH / 2);
                const uv = geo.attributes.uv;
                for (let i = 0; i < uv.count; i++) { uv.setX(i, 1 - uv.getX(i)); uv.setY(i, 1 - uv.getY(i)); }
                uv.needsUpdate = true;
                pdfPlane.renderOrder = -1;
                pdfPlane.userData.conditionUid = '';
                pdfPlane.userData.takeoffUid = '';
                scene.add(pdfPlane);
                const pageLayer = sceneData.page_image_layer || {};
                registerLayerObject(pageLayer.uid, pdfPlane, true);
                buildLayerPanel();
            }).catch(e => console.warn('PDF floor failed:', e));
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateCameraClipping();
            if (wboitPass) {
                wboitPass.render(renderer);
            } else {
                renderer.render(scene, camera);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            updateCameraClipping(true);
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (wboitPass) wboitPass.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
