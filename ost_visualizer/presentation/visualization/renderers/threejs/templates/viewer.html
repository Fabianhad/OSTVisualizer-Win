<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>{{TITLE}}</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <style>
      /* Layout: one working screen. The model viewport takes the width; a schedule column on the right
       carries visibility and view controls. Stacks on phones. */
      :root {
        color-scheme: light;
        --bg: #e9ecee;
        --panel: #f6f7f8;
        --ink: #1c2a33;
        --muted: #5b6b75;
        --line: #c9d0d5;
        --view: #dfe4e7;
        --accent: #b4541a;
        --focus: #0b6fa4;
        --edge: #16222a;
        --hover: rgba(28, 42, 51, 0.06);
        --menu-shadow: 0 10px 28px rgba(22, 34, 42, 0.18);
        --plan-shadow: 0 10px 32px rgba(22, 34, 42, 0.18);
        --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
        --f-body:
          "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #12191e;
          --panel: #19232a;
          --ink: #e3eaee;
          --muted: #93a3ad;
          --line: #2e3c46;
          --view: #0e1418;
          --accent: #e58a4e;
          --focus: #5bb8ea;
          --edge: #05090b;
          --hover: rgba(227, 234, 238, 0.06);
          --menu-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
          --plan-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
        }
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #12191e;
        --panel: #19232a;
        --ink: #e3eaee;
        --muted: #93a3ad;
        --line: #2e3c46;
        --view: #0e1418;
        --accent: #e58a4e;
        --focus: #5bb8ea;
        --edge: #05090b;
        --hover: rgba(227, 234, 238, 0.06);
        --menu-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        --plan-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--f-body);
        font-size: 14px;
        line-height: 1.45;
        padding-top: var(--safe-top);
        padding-bottom: var(--safe-bottom);
      }

      [hidden] {
        display: none !important;
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 372px;
        grid-template-rows: auto minmax(0, 1fr);
      }

      header {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 18px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        min-width: 0;
      }

      h1 {
        font-family: var(--f-display);
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        margin: 0;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      header p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      header p:empty {
        display: none;
      }

      .view {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: var(--view);
      }

      #canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }

      #canvas:active {
        cursor: grabbing;
      }

      body.plan-mode #canvas {
        display: none;
      }

      .bar {
        position: absolute;
        left: 12px;
        top: 12px;
        right: 12px;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 6px;
        pointer-events: none;
      }

      .bar > * {
        pointer-events: auto;
      }

      .bar .spacer {
        flex: 1;
        pointer-events: none;
      }

      button {
        font: 500 12px/1 var(--f-body);
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 8px 10px;
        border-radius: 3px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--muted);
      }

      button:disabled {
        cursor: default;
        color: var(--muted);
        opacity: 0.55;
        border-color: var(--line);
      }

      button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      #view-mode-switch {
        display: flex;
        gap: 0;
      }

      #view-mode-switch .view-mode-button + .view-mode-button {
        margin-left: -1px;
      }

      #view-mode-switch .view-mode-button:first-child {
        border-radius: 3px 0 0 3px;
      }

      #view-mode-switch .view-mode-button:last-child {
        border-radius: 0 3px 3px 0;
      }

      .view-mode-button {
        min-width: 52px;
      }

      .view-mode-button.active {
        position: relative;
        z-index: 1;
      }

      #page-combo {
        position: relative;
        max-width: min(360px, 100%);
      }

      #page-combo.disabled {
        display: none;
      }

      #page-combo-button {
        max-width: min(360px, calc(100vw - 48px));
        min-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }

      #page-combo-button::after {
        content: "\25BE";
        margin-left: 8px;
        color: var(--muted);
      }

      #page-combo-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        min-width: min(360px, calc(100vw - 48px));
        max-width: min(420px, calc(100vw - 32px));
        max-height: min(320px, 60vh);
        overflow-y: auto;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel);
        box-shadow: var(--menu-shadow);
        display: none;
      }

      #page-combo.open #page-combo-menu {
        display: block;
      }

      .page-combo-row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 2px;
      }

      .page-combo-row:hover {
        background: var(--hover);
      }

      .page-combo-row.active .page-combo-name {
        color: var(--accent);
        font-weight: 600;
      }

      .page-combo-row input[type="checkbox"] {
        accent-color: var(--accent);
        margin: 0;
        cursor: pointer;
      }

      .page-combo-name {
        border: none;
        background: transparent;
        padding: 4px 0;
        font-size: 12.5px;
        font-weight: 400;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #tip {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 4;
        max-width: calc(100% - 24px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        padding: 8px 10px;
        font-size: 12.5px;
        border-radius: 2px;
      }

      #tip b {
        font-weight: 600;
      }

      #tip span {
        display: block;
        font-family: var(--f-mono);
        font-size: 12px;
        color: var(--muted);
        white-space: pre-wrap;
      }

      #plan-view {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--view);
        touch-action: none;
        cursor: grab;
      }

      body:not(.plan-mode) #plan-view {
        display: none;
      }

      #plan-view.panning {
        cursor: grabbing;
      }

      #plan-content {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        background: white;
        box-shadow: var(--plan-shadow);
      }

      #plan-pdf-canvas,
      #plan-overlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }

      #plan-overlay {
        pointer-events: none;
      }

      .elevation-callout {
        pointer-events: none;
      }

      .elevation-callout text {
        fill: currentColor;
        stroke: none;
        font-family: Arial, sans-serif;
        font-size: 10px;
        font-weight: 400;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      aside {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        border-left: 1px solid var(--line);
        background: var(--panel);
        padding: 14px 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      h2 {
        font-family: var(--f-display);
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        margin: 0 0 8px;
        color: var(--muted);
      }

      .vh {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin: 0 0 8px;
      }

      .vh h2 {
        margin: 0;
      }

      .vis-by {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      select {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 4px 6px;
        border-radius: 3px;
      }

      .opt {
        display: flex;
        gap: 6px;
        margin: 0 0 10px;
      }

      .opt button {
        flex: 1;
        padding: 9px 8px;
      }

      #layer-list {
        font-size: 13px;
      }

      .visibility-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 6px 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }

      .visibility-row input[type="checkbox"] {
        margin: 3px 0 0;
        accent-color: var(--accent);
        flex: none;
        cursor: pointer;
      }

      .condition-color-swatch {
        flex: none;
        width: 12px;
        height: 12px;
        margin-top: 3px;
        border: 1px solid var(--edge);
        background: var(--muted);
      }

      .visibility-name {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .visibility-row.disabled .visibility-name {
        color: var(--muted);
      }

      .condition-type-title {
        font: 500 11px/1.2 var(--f-body);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 12px 0 6px;
      }

      .condition-type-title:first-child {
        padding-top: 0;
      }

      .visibility-empty {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
        padding: 6px 0;
        border-top: 1px solid var(--line);
      }

      .ctl {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) 4.2em;
        gap: 8px 10px;
        align-items: center;
        font-size: 13px;
      }

      .ctl input[type="checkbox"] {
        justify-self: start;
        margin: 0;
        accent-color: var(--accent);
      }

      .ctl input[type="range"] {
        width: 100%;
        margin: 0;
        accent-color: var(--accent);
      }

      .ctl output {
        font-family: var(--f-mono);
        font-size: 12px;
        text-align: right;
        color: var(--muted);
      }

      .note {
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0 0;
      }

      .note a {
        color: inherit;
        text-decoration: underline;
      }

      @media (max-width: 860px) {
        html,
        body {
          height: auto;
        }

        .app {
          height: auto;
          display: block;
        }

        header {
          padding: 10px 16px;
        }

        .view {
          height: 62svh;
          min-height: 340px;
        }

        aside {
          border-left: 0;
          border-top: 1px solid var(--line);
          overflow: visible;
        }

        .bar {
          left: 8px;
          right: 8px;
          top: 8px;
        }

        #tip {
          left: 8px;
          bottom: 8px;
          max-width: calc(100% - 16px);
        }

        .visibility-row {
          padding: 9px 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header>
        <h1 id="viewer-title">{{TITLE}}</h1>
        <p id="viewer-subtitle">{{SUBTITLE}}</p>
      </header>
      <div class="view" id="viewport">
        <canvas id="canvas" aria-label="3D model of the takeoff"></canvas>
        <div id="plan-view" aria-label="2D plan view">
          <div id="plan-content">
            <canvas id="plan-pdf-canvas"></canvas>
            <svg id="plan-overlay" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>
        <div class="bar" id="view-bar">
          <div id="view-mode-switch" role="group" aria-label="View mode">
            <button
              type="button"
              id="view-mode-plan"
              class="view-mode-button"
              aria-pressed="false"
            >
              Plan
            </button>
            <button
              type="button"
              id="view-mode-3d"
              class="view-mode-button active"
              aria-pressed="true"
            >
              3D
            </button>
          </div>
          <div id="page-combo" class="disabled">
            <button
              type="button"
              id="page-combo-button"
              aria-haspopup="listbox"
              aria-expanded="false"
            ></button>
            <div id="page-combo-menu" role="listbox" aria-label="Pages"></div>
          </div>
          <span class="spacer"></span>
          <button type="button" id="view-reset">Reset view</button>
          <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Switch to dark mode"
            title="Switch to dark mode"
          >
            <span data-theme-label>Dark</span>
          </button>
        </div>
        <div id="tip">
          Drag to orbit, scroll or pinch to zoom, right-drag or two fingers to
          pan.
        </div>
      </div>
      <aside>
        <section id="layer-panel" aria-labelledby="visibility-heading">
          <div class="vh">
            <h2 id="visibility-heading">Visibility</h2>
            <label class="vis-by" for="visibility-group"
              >Show by
              <select id="visibility-group">
                <option value="layer">Layer</option>
                <option value="condition">Condition</option>
                <option value="area">Area</option>
              </select>
            </label>
          </div>
          <div class="opt" id="layer-actions">
            <button type="button" id="layer-show-all">Show all</button>
            <button type="button" id="layer-hide-all">Hide all</button>
          </div>
          <div id="layer-list"></div>
          <p class="note">
            An object shows only when its layer, condition and area are all on.
          </p>
        </section>
        <section id="view-controls" aria-labelledby="view-controls-heading">
          <h2 id="view-controls-heading">View controls</h2>
          <div class="ctl">
            <label for="edges-toggle">Edges</label
            ><input id="edges-toggle" type="checkbox" /><span></span>
            <label for="tower-crane-toggle" id="tower-crane-label" hidden
              >Tower crane</label
            ><input
              id="tower-crane-toggle"
              type="checkbox"
              checked
              hidden
            /><span id="tower-crane-spacer" hidden></span>
            <label for="cut-north-south">Cut north&ndash;south</label
            ><input
              id="cut-north-south"
              type="range"
              min="0"
              max="1000"
              step="1"
              value="1000"
            /><output id="cut-north-south-value" for="cut-north-south"
              >off</output
            >
            <label for="cut-east-west">Cut east&ndash;west</label
            ><input
              id="cut-east-west"
              type="range"
              min="0"
              max="1000"
              step="1"
              value="1000"
            /><output id="cut-east-west-value" for="cut-east-west">off</output>
          </div>
          <p class="note" id="tower-crane-credit" hidden></p>
        </section>
      </aside>
    </div>
    <script type="application/json" id="scene-data">
      {{SCENE_DATA}}
    </script>
    <script>
      (function () {
        var theme =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        try {
          var storedTheme = localStorage.getItem("fabian-theme");
          if (storedTheme === "light" || storedTheme === "dark")
            theme = storedTheme;
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const THEME_STORAGE_KEY = "fabian-theme";

      // Shading copied from the native renderer (cpp_extensions/src/renderer/renderer.cpp):
      // Lambert with an ambient term and three white directional lights, no specular,
      // no gamma or tone mapping. Directions are the native Z-up vectors mapped to Y-up as (x, z, -y).
      const NATIVE_AMBIENT_INTENSITY = 0.55;
      const NATIVE_KEY_LIGHT = { dir: [500.0, 500.0, 500.0], intensity: 0.45 };
      const NATIVE_FILL_LIGHT = {
        dir: [-500.0, 500.0, -500.0],
        intensity: 0.35,
      };
      const NATIVE_RIM_LIGHT = { dir: [0.0, -500.0, -500.0], intensity: 0.2 };
      const NATIVE_TRANSPARENT_ALPHA = 0.99;
      const EDGE_THRESHOLD_DEGREES = 15;
      const EDGE_COLOR_SCALE = 0.45;

      function isViewerTheme(value) {
        return value === "light" || value === "dark";
      }

      function getSystemViewerTheme() {
        return window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      }

      function getViewerTheme() {
        const theme = document.documentElement.dataset.theme;
        return isViewerTheme(theme) ? theme : getSystemViewerTheme();
      }

      function getViewerBackgroundColor() {
        return getComputedStyle(document.documentElement)
          .getPropertyValue("--view")
          .trim();
      }

      const sceneData = JSON.parse(
        document.getElementById("scene-data").textContent,
      );
      const viewOptions = sceneData.view_options || {};
      const viewport = document.getElementById("viewport");
      const canvas = document.getElementById("canvas");
      // Colours are used as given (no sRGB to linear conversion), like the native renderer.
      if (THREE.ColorManagement) THREE.ColorManagement.enabled = false;
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
      });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(getViewportWidth(), getViewportHeight(), false);
      renderer.setClearColor(getViewerBackgroundColor());
      renderer.outputEncoding = THREE.LinearEncoding;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.localClippingEnabled = true;

      function getViewportWidth() {
        return Math.max(1, viewport.clientWidth || window.innerWidth);
      }

      function getViewportHeight() {
        return Math.max(1, viewport.clientHeight || window.innerHeight);
      }

      const scene = new THREE.Scene();
      const layerPanel = document.getElementById("layer-panel");
      const layerList = document.getElementById("layer-list");
      const layerShowAll = document.getElementById("layer-show-all");
      const layerHideAll = document.getElementById("layer-hide-all");
      const visibilityGroupSelect = document.getElementById("visibility-group");
      const edgesToggle = document.getElementById("edges-toggle");
      const cutNorthSouthInput = document.getElementById("cut-north-south");
      const cutNorthSouthValue = document.getElementById(
        "cut-north-south-value",
      );
      const cutEastWestInput = document.getElementById("cut-east-west");
      const cutEastWestValue = document.getElementById("cut-east-west-value");
      const viewResetButton = document.getElementById("view-reset");
      const viewTip = document.getElementById("tip");
      const planView = document.getElementById("plan-view");
      const planContent = document.getElementById("plan-content");
      const planPdfCanvas = document.getElementById("plan-pdf-canvas");
      const planOverlay = document.getElementById("plan-overlay");
      const planModeButton = document.getElementById("view-mode-plan");
      const threeModeButton = document.getElementById("view-mode-3d");
      const themeToggle = document.getElementById("theme-toggle");
      const pageCombo = document.getElementById("page-combo");
      const pageComboButton = document.getElementById("page-combo-button");
      const pageComboMenu = document.getElementById("page-combo-menu");
      const layerVisibility = new Map();
      const conditionVisibility = new Map();
      const areaVisibility = new Map();
      const page3dVisibility = new Map();
      const layerRows = new Map();
      const conditionRows = new Map();
      const areaRows = new Map();
      const visibilityObjects = [];
      const planVisibilityObjects = [];
      const UNLAYERED_UID = "__unlayered__";
      const IMAGE_LAYER_DISPLAY_NAME = "Image";
      const UNLAYERED_LAYER_NAME = "Unlayered";
      const FALLBACK_VISIBILITY_NAME = "Unassigned";
      const FALLBACK_CONDITION_NAME = "Condition";
      const FALLBACK_AREA_NAME = "Area";
      const UNASSIGNED_CDN_TYPE_UID = "__unassigned_cdn_type__";
      const UNASSIGNED_CDN_TYPE_NAME = "(unassigned)";
      const UNKNOWN_CDN_TYPE_NAME = "Unknown";
      const FALLBACK_HEX_COLOR = "#808080";
      const NEGATIVE_TAKEOFF_STROKE = "#dc2626";
      const PLAN_FIT_MARGIN = 0.95;
      const PLAN_MIN_SCALE = 0.05;
      const PLAN_MAX_SCALE = 50.0;
      const PLAN_WHEEL_SENSITIVITY = 0.001;
      const SVG_NAMESPACE = "http://www.w3.org/2000/svg";
      const ELEVATION_CALLOUT_LINE_SPACING = 12;

      const TIP_3D =
        "Drag to orbit, scroll or pinch to zoom, right-drag or two fingers to pan.";
      const TIP_PLAN = "Drag to pan, scroll or pinch to zoom.";
      const VISIBILITY_GROUPS = ["layer", "condition", "area"];
      let visibilityGroup = "layer";
      let edgesEnabled = viewOptions.edges === true;
      // Tower cranes (sceneData.tower_cranes) are visual only; this toggle hides them all.
      let towerCraneEnabled = viewOptions.tower_crane !== false;

      function updateThemeToggle(theme) {
        const nextTheme = theme === "light" ? "dark" : "light";
        const label = nextTheme === "light" ? "Light" : "Dark";
        const title = `Switch to ${nextTheme} mode`;
        themeToggle.setAttribute("aria-label", title);
        themeToggle.setAttribute("title", title);
        const text = themeToggle.querySelector("[data-theme-label]");
        if (text) text.textContent = label;
      }

      function applyViewerTheme(theme, persist = false) {
        const nextTheme = isViewerTheme(theme) ? theme : getSystemViewerTheme();
        document.documentElement.dataset.theme = nextTheme;
        renderer.setClearColor(getViewerBackgroundColor());
        if (persist) {
          try {
            localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
          } catch (_) {}
        }
        updateThemeToggle(nextTheme);
      }

      function normalizeLayerUid(layerUid) {
        const uid =
          layerUid === undefined || layerUid === null ? "" : String(layerUid);
        return uid || UNLAYERED_UID;
      }

      function normalizeOptionalUid(uid) {
        if (uid === undefined || uid === null) return "";
        const normalized = String(uid);
        return normalized === "0" ? "" : normalized;
      }

      function normalizeScenePage(page) {
        const uid = normalizeOptionalUid(page.uid);
        if (!uid) return null;
        const label =
          page.label ||
          [page.sequence, page.sheet_no, page.name]
            .filter(
              (value) =>
                value !== undefined &&
                value !== null &&
                String(value).trim() !== "" &&
                String(value) !== "0",
            )
            .join(" - ") ||
          uid;
        return {
          uid: uid,
          label: label,
          name: page.name || "",
          sheetNo: page.sheet_no || "",
          sequence: Number(page.sequence || 0),
          width: Number(page.width || 0),
          height: Number(page.height || 0),
          pageWidth: Number(page.page_width || 0),
          pageHeight: Number(page.page_height || 0),
          imageLayerUid: normalizeLayerUid(page.image_layer_uid),
          visible: page.visible !== false,
          pdfDocumentUid: normalizeOptionalUid(page.pdf_document_uid),
          pdfPageIndex: Number(page.pdf_page_index || 0),
          planeX: Number(page.plane_x),
          planeY: Number(page.plane_y),
          planeZ: Number(page.plane_z),
          planeWidth: Number(page.plane_width || page.page_width || 0),
          planeHeight: Number(page.plane_height || page.page_height || 0),
          planeFlipU: page.plane_flip_u !== false,
          planeFlipV: page.plane_flip_v !== false,
        };
      }

      function normalizeScenePages() {
        const pages = Array.isArray(sceneData.pages)
          ? sceneData.pages.map(normalizeScenePage).filter(Boolean)
          : [];
        return pages;
      }

      function buildPdfDocumentMap() {
        const documents = new Map();
        const entries = Array.isArray(sceneData.pdf_documents)
          ? sceneData.pdf_documents
          : [];
        entries.forEach((document) => {
          const uid = normalizeOptionalUid(document.uid);
          if (uid && document.data_base64)
            documents.set(uid, document.data_base64);
        });
        return documents;
      }

      function resolveActivePageUid(pages) {
        const exported = new Set(pages.map((page) => page.uid));
        const requested = normalizeOptionalUid(sceneData.active_page_uid);
        if (requested && exported.has(requested)) return requested;
        const selected = Array.isArray(sceneData.selected_page_uids)
          ? sceneData.selected_page_uids.map(normalizeOptionalUid)
          : [];
        const selectedMatch = selected.find((uid) => exported.has(uid));
        return selectedMatch || (pages[0] ? pages[0].uid : "");
      }

      const runtimePages = normalizeScenePages();
      const pdfDocuments = buildPdfDocumentMap();
      let activePageUid = resolveActivePageUid(runtimePages);
      const maxPageW = runtimePages.reduce(
        (value, page) => Math.max(value, page.pageWidth || 0),
        0,
      );
      const maxPageH = runtimePages.reduce(
        (value, page) => Math.max(value, page.pageHeight || 0),
        0,
      );

      function getActivePage() {
        return (
          runtimePages.find((page) => page.uid === activePageUid) ||
          runtimePages[0] ||
          null
        );
      }

      function ensureVisibilityEntry(
        registry,
        uid,
        name,
        visible = true,
        fallbackName = FALLBACK_VISIBILITY_NAME,
      ) {
        if (!uid) return null;
        if (!registry.has(uid)) {
          registry.set(uid, {
            uid: uid,
            name: name || fallbackName || uid,
            visible: visible !== false,
          });
        } else {
          const entry = registry.get(uid);
          if (name && entry.name === uid) entry.name = name;
        }
        return registry.get(uid);
      }

      function normalizeHexColor(color) {
        if (typeof color !== "string") return "";
        const normalized = color.trim();
        return /^#[0-9a-fA-F]{6}$/.test(normalized) ? normalized : "";
      }

      function getConditionTypeUid(condition) {
        return (
          normalizeOptionalUid(condition.cdn_type_uid) ||
          UNASSIGNED_CDN_TYPE_UID
        );
      }

      function getConditionTypeName(condition) {
        const cdnTypeUid = normalizeOptionalUid(condition.cdn_type_uid);
        if (!cdnTypeUid) return UNASSIGNED_CDN_TYPE_NAME;
        return condition.cdn_type_name || UNKNOWN_CDN_TYPE_NAME;
      }

      function compareByName(a, b) {
        return a.name.localeCompare(b.name);
      }

      function compareConditionEntries(a, b) {
        return a.refNo - b.refNo || compareByName(a, b);
      }

      function buildVisibilityRegistries() {
        const layers = Array.isArray(sceneData.layers) ? sceneData.layers : [];
        layers.forEach((layer) => {
          ensureVisibilityEntry(
            layerVisibility,
            normalizeLayerUid(layer.uid),
            layer.name,
            layer.visible,
            UNLAYERED_LAYER_NAME,
          );
        });
        if (sceneData.page_image_layer) {
          const layer = sceneData.page_image_layer;
          const pageEntry = ensureVisibilityEntry(
            layerVisibility,
            normalizeLayerUid(layer.uid),
            layer.name || IMAGE_LAYER_DISPLAY_NAME,
            layer.visible,
            IMAGE_LAYER_DISPLAY_NAME,
          );
          pageEntry.visible = layer.visible !== false;
        }
        const conditions = Array.isArray(sceneData.conditions)
          ? sceneData.conditions
          : [];
        conditions.forEach((condition) => {
          const entry = ensureVisibilityEntry(
            conditionVisibility,
            normalizeOptionalUid(condition.uid),
            condition.name,
            condition.visible,
            FALLBACK_CONDITION_NAME,
          );
          if (entry) {
            entry.cdnTypeUid = getConditionTypeUid(condition);
            entry.cdnTypeName = getConditionTypeName(condition);
            entry.color = normalizeHexColor(condition.color);
            entry.refNo = Number.isFinite(Number(condition.ref_no))
              ? Number(condition.ref_no)
              : 0;
          }
        });
        const areas = Array.isArray(sceneData.areas) ? sceneData.areas : [];
        areas.forEach((area) => {
          ensureVisibilityEntry(
            areaVisibility,
            normalizeOptionalUid(area.uid),
            area.name,
            area.visible,
            FALLBACK_AREA_NAME,
          );
        });
        runtimePages.forEach((page) => {
          ensureVisibilityEntry(
            page3dVisibility,
            page.uid,
            page.label,
            page.visible,
            "Page",
          );
        });
      }

      function isGroupVisible(registry, uid) {
        if (!uid) return true;
        const entry = registry.get(uid);
        return entry ? entry.visible !== false : true;
      }

      function isObjectVisible(object) {
        return (
          object.userData.baseVisible !== false &&
          (object.userData.towerCrane !== true || towerCraneEnabled) &&
          (object.userData.usesPage3dVisibility !== true ||
            isGroupVisible(page3dVisibility, object.userData.pageUid)) &&
          isGroupVisible(layerVisibility, object.userData.layerUid) &&
          isGroupVisible(conditionVisibility, object.userData.conditionUid) &&
          isGroupVisible(areaVisibility, object.userData.areaUid)
        );
      }

      function setRenderedObjectVisible(object, visible) {
        if (object && object.isObject3D) {
          object.visible = visible;
        } else if (object && object.style) {
          object.style.display = visible ? "" : "none";
        }
      }

      function registerVisibilityObject(keys, object, baseVisible = true) {
        const layerUid = normalizeLayerUid(keys.layerUid);
        const pageUid = normalizeOptionalUid(keys.pageUid);
        const conditionUid = normalizeOptionalUid(keys.conditionUid);
        const areaUid = normalizeOptionalUid(keys.areaUid);
        const usesPage3dVisibility = keys.usesPage3dVisibility === true;
        ensureVisibilityEntry(
          layerVisibility,
          layerUid,
          keys.layerName,
          true,
          UNLAYERED_LAYER_NAME,
        );
        if (usesPage3dVisibility && pageUid) {
          ensureVisibilityEntry(
            page3dVisibility,
            pageUid,
            keys.pageName,
            true,
            "Page",
          );
        }
        if (conditionUid) {
          ensureVisibilityEntry(
            conditionVisibility,
            conditionUid,
            keys.conditionName,
            true,
            FALLBACK_CONDITION_NAME,
          );
        }
        if (areaUid) {
          ensureVisibilityEntry(
            areaVisibility,
            areaUid,
            keys.areaName,
            true,
            FALLBACK_AREA_NAME,
          );
        }
        if (!object.userData) object.userData = {};
        object.userData.pageUid = pageUid;
        object.userData.layerUid = layerUid;
        object.userData.conditionUid = conditionUid;
        object.userData.areaUid = areaUid;
        object.userData.usesPage3dVisibility = usesPage3dVisibility;
        object.userData.baseVisible = baseVisible !== false;
        visibilityObjects.push(object);
        setRenderedObjectVisible(object, isObjectVisible(object));
      }

      function updateVisibilityRows(registry, rows) {
        for (const [uid, row] of rows) {
          const entry = registry.get(uid);
          const visible = entry ? entry.visible !== false : true;
          row.classList.toggle("disabled", !visible);
          const checkbox = row.querySelector('input[type="checkbox"]');
          if (checkbox) checkbox.checked = visible;
        }
      }

      function applyObjectVisibility() {
        visibilityObjects.forEach((object) => {
          setRenderedObjectVisible(object, isObjectVisible(object));
        });
        updateVisibilityRows(layerVisibility, layerRows);
        updateVisibilityRows(conditionVisibility, conditionRows);
        updateVisibilityRows(areaVisibility, areaRows);
        updatePageComboRows();
      }

      function setGroupVisible(registry, uid, visible) {
        const entry = registry.get(uid);
        if (!entry) return;
        entry.visible = Boolean(visible);
        applyObjectVisibility();
      }

      function setAllGroupsVisible(visible) {
        [layerVisibility, conditionVisibility, areaVisibility].forEach(
          (registry) => {
            for (const entry of registry.values()) {
              entry.visible = Boolean(visible);
            }
          },
        );
        applyObjectVisibility();
      }

      function createVisibilityRow(entry, registry, rows, options = {}) {
        const row = document.createElement("label");
        row.className = options.rowClass
          ? `visibility-row ${options.rowClass}`
          : "visibility-row";
        row.title = entry.name;
        row.classList.toggle("disabled", !entry.visible);

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = entry.visible;
        checkbox.addEventListener("change", () => {
          setGroupVisible(registry, entry.uid, checkbox.checked);
        });

        const name = document.createElement("span");
        name.className = "visibility-name";
        name.textContent = entry.name;

        if (options.swatchClass) {
          const swatch = document.createElement("div");
          swatch.className = options.swatchClass;
          if (entry.color) swatch.style.background = entry.color;
          row.append(checkbox, swatch, name);
        } else {
          row.append(checkbox, name);
        }

        rows.set(entry.uid, row);
        return row;
      }

      function setRegistryVisible(registry, visible) {
        for (const entry of registry.values()) {
          entry.visible = Boolean(visible);
        }
        applyObjectVisibility();
      }

      function getVisibilityGroupRegistry(group) {
        if (group === "condition") return conditionVisibility;
        if (group === "area") return areaVisibility;
        return layerVisibility;
      }

      function renderVisibilitySection(title, registry, rows) {
        const entries = Array.from(registry.values());
        if (!entries.length) return 0;
        const section = document.createElement("div");
        section.className = "visibility-section";
        section.setAttribute("aria-label", title);
        entries.forEach((entry) => {
          section.appendChild(createVisibilityRow(entry, registry, rows));
        });
        layerList.appendChild(section);
        return entries.length;
      }

      function renderConditionSection() {
        const entries = Array.from(conditionVisibility.values());
        if (!entries.length) return 0;
        const section = document.createElement("div");
        section.className = "visibility-section";
        section.setAttribute("aria-label", "Conditions");

        const groups = new Map();
        entries.forEach((entry) => {
          const groupUid = entry.cdnTypeUid || UNASSIGNED_CDN_TYPE_UID;
          if (!groups.has(groupUid)) {
            groups.set(groupUid, {
              uid: groupUid,
              name: entry.cdnTypeName || UNASSIGNED_CDN_TYPE_NAME,
              entries: [],
            });
          }
          groups.get(groupUid).entries.push(entry);
        });

        const sortedGroups = Array.from(groups.values()).sort(compareByName);
        sortedGroups.forEach((group) => {
          const groupHeader = document.createElement("div");
          groupHeader.className = "condition-type-title";
          groupHeader.textContent = group.name;
          section.appendChild(groupHeader);

          group.entries.sort(compareConditionEntries).forEach((entry) => {
            section.appendChild(
              createVisibilityRow(entry, conditionVisibility, conditionRows, {
                rowClass: "condition-row",
                swatchClass: "condition-color-swatch",
              }),
            );
          });
        });

        layerList.appendChild(section);
        return entries.length;
      }

      function updateVisibilityGroupOptions() {
        Array.from(visibilityGroupSelect.options).forEach((option) => {
          option.disabled = getVisibilityGroupRegistry(option.value).size === 0;
        });
        if (getVisibilityGroupRegistry(visibilityGroup).size === 0) {
          const fallback = VISIBILITY_GROUPS.find(
            (group) => getVisibilityGroupRegistry(group).size > 0,
          );
          if (fallback) visibilityGroup = fallback;
        }
        visibilityGroupSelect.value = visibilityGroup;
      }

      function buildLayerPanel() {
        layerList.innerHTML = "";
        layerRows.clear();
        conditionRows.clear();
        areaRows.clear();
        updateVisibilityGroupOptions();
        let entryCount = 0;
        if (visibilityGroup === "condition") {
          entryCount = renderConditionSection();
        } else if (visibilityGroup === "area") {
          entryCount = renderVisibilitySection(
            "Areas",
            areaVisibility,
            areaRows,
          );
        } else {
          entryCount = renderVisibilitySection(
            "Layers",
            layerVisibility,
            layerRows,
          );
        }
        if (!entryCount) {
          const empty = document.createElement("p");
          empty.className = "visibility-empty";
          empty.textContent = "Nothing to list in this group.";

        layerShowAll.disabled = !entryCount;
        layerHideAll.disabled = !entryCount;
        applyObjectVisibility();
      }

      function setVisibilityGroup(group) {
        visibilityGroup = VISIBILITY_GROUPS.includes(group) ? group : "layer";
        buildLayerPanel();
      }

      buildVisibilityRegistries();
      visibilityGroupSelect.addEventListener("change", () =>
        setVisibilityGroup(visibilityGroupSelect.value),
      );
      layerShowAll.addEventListener("click", () =>
        setRegistryVisible(getVisibilityGroupRegistry(visibilityGroup), true),
      );
      layerHideAll.addEventListener("click", () =>
        setRegistryVisible(getVisibilityGroupRegistry(visibilityGroup), false),
      );
      window.toggleAll = setAllGroupsVisible;

      const takeoffs2D = Array.isArray(sceneData.takeoffs_2d)
        ? sceneData.takeoffs_2d
        : [];
      const elevationCallouts = Array.isArray(sceneData.elevation_callouts)
        ? sceneData.elevation_callouts
        : [];
      const hasPlanData = runtimePages.some(
        (page) => Number(page.width) > 0 && Number(page.height) > 0,
      );
      let planPageRegistered = false;
      let pdfPlane = null;
      const pdfPageCanvasCache = new Map();
      const pdfDocumentPromises = new Map();
      const planState = {
        scale: 1.0,
        offsetX: 0.0,
        offsetY: 0.0,
        initialized: false,
        userInteracted: false,
        isPanning: false,
        panStartX: 0.0,
        panStartY: 0.0,
        startOffsetX: 0.0,
        startOffsetY: 0.0,
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function setPlanTransform() {
        planContent.style.transform = `translate(${planState.offsetX}px, ${planState.offsetY}px) scale(${planState.scale})`;
      }

      function fitPlanToViewport(force = false) {
        const page = getActivePage();
        if (
          !page ||
          !hasPlanData ||
          (!force && planState.initialized && planState.userInteracted)
        )
          return;
        const pageWidth = Number(page.width);
        const pageHeight = Number(page.height);
        const viewWidth = planView.clientWidth || window.innerWidth;
        const viewHeight = planView.clientHeight || window.innerHeight;
        const fitScale =
          Math.min(viewWidth / pageWidth, viewHeight / pageHeight) *
          PLAN_FIT_MARGIN;
        planState.scale = clamp(fitScale, PLAN_MIN_SCALE, PLAN_MAX_SCALE);
        planState.offsetX = (viewWidth - pageWidth * planState.scale) / 2.0;
        planState.offsetY = (viewHeight - pageHeight * planState.scale) / 2.0;
        planState.initialized = true;
        setPlanTransform();
      }

      function ringToPath(ring) {
        if (!Array.isArray(ring) || ring.length < 3) return "";
        return (
          ring
            .map((point, index) => {
              const x = Number(point[0]);
              const y = Number(point[1]);
              return `${index === 0 ? "M" : "L"} ${x} ${y}`;
            })
            .join(" ") + " Z"
        );
      }

      function createPlanSvgElement(tagName) {
        return document.createElementNS(SVG_NAMESPACE, tagName);
      }

      function createPlanCalloutText(value, y) {
        const text = createPlanSvgElement("text");
        text.setAttribute("x", "0");
        text.setAttribute("y", String(y));
        text.textContent = value;
        return text;
      }

      function renderPlanElevationCallouts(page) {
        elevationCallouts.forEach((callout) => {
          const calloutPageUid = callout.page_uid;
          if (calloutPageUid !== page.uid) return;

          const group = createPlanSvgElement("g");
          group.classList.add("elevation-callout");
          group.style.color = callout.color;
          group.setAttribute(
            "transform",
            `translate(${callout.x} ${callout.y})`,
          );
          group.setAttribute("aria-hidden", "true");

          const lines = callout.lines;
          const rowSpan = (lines.length - 1) * ELEVATION_CALLOUT_LINE_SPACING;
          const firstRowY = -rowSpan / 2;
          group.append(
            ...lines.map((line, index) =>
              createPlanCalloutText(
                line,
                firstRowY + index * ELEVATION_CALLOUT_LINE_SPACING,
              ),
            ),
          );
          planOverlay.appendChild(group);
          registerVisibilityObject(
            {
              pageUid: calloutPageUid,
              pageName: page.label,
              usesPage3dVisibility: false,
              layerUid: callout.layer_uid,
              conditionUid: callout.condition_uid,
              areaUid: callout.area_uid,
            },
            group,
          );
          planVisibilityObjects.push(group);
        });
      }

      function renderPlanTakeoffs() {
        planVisibilityObjects.forEach((object) => {
          const index = visibilityObjects.indexOf(object);
          if (index >= 0) visibilityObjects.splice(index, 1);
        });
        planVisibilityObjects.length = 0;
        planOverlay.innerHTML = "";
        const page = getActivePage();
        if (!page) return;
        takeoffs2D.forEach((takeoff) => {
          const takeoffPageUid =
            normalizeOptionalUid(takeoff.page_uid) || page.uid;
          if (takeoffPageUid !== page.uid) return;
          if (!Array.isArray(takeoff.rings) || !takeoff.rings.length) return;
          const pathData = takeoff.rings
            .map(ringToPath)
            .filter(Boolean)
            .join(" ");
          if (!pathData) return;
          const path = createPlanSvgElement("path");
          const color = normalizeHexColor(takeoff.color) || FALLBACK_HEX_COLOR;
          const opacity = clamp(Number(takeoff.opacity || 0.5), 0.0, 1.0);
          path.setAttribute("d", pathData);
          path.setAttribute("fill-rule", "evenodd");
          path.setAttribute("fill", color);
          path.setAttribute("fill-opacity", String(Math.min(opacity, 0.45)));
          path.setAttribute(
            "stroke",
            takeoff.is_negative ? NEGATIVE_TAKEOFF_STROKE : color,
          );
          path.setAttribute("stroke-opacity", String(Math.max(opacity, 0.75)));
          path.setAttribute("stroke-width", "1.5");
          path.setAttribute("vector-effect", "non-scaling-stroke");
          if (takeoff.is_negative) {
            path.setAttribute("stroke-dasharray", "8 6");
            path.setAttribute("fill-opacity", "0.08");
          }
          planOverlay.appendChild(path);
          registerVisibilityObject(
            {
              pageUid: takeoffPageUid,
              pageName: page.label,
              usesPage3dVisibility: false,
              layerUid: takeoff.layer_uid,
              conditionUid: takeoff.condition_uid,
              conditionName: takeoff.name,
              areaUid: takeoff.area_uid,
            },
            path,
            takeoff.visible !== false,
          );
          planVisibilityObjects.push(path);
        });
        renderPlanElevationCallouts(page);
      }

      function setupBlankPlanPage(page) {
        if (!page || !hasPlanData) return;
        const pageWidth = Number(page.width);
        const pageHeight = Number(page.height);
        const dpr = Math.max(window.devicePixelRatio || 1, 1);
        planPdfCanvas.width = Math.max(1, Math.round(pageWidth * dpr));
        planPdfCanvas.height = Math.max(1, Math.round(pageHeight * dpr));
        const ctx = planPdfCanvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, pageWidth, pageHeight);
      }

      function setupPlanView(pdfCanvas = null, forceFit = true) {
        if (!hasPlanData) {
          planModeButton.disabled = true;
          return;
        }
        const page = getActivePage();
        if (!page) return;
        const pageWidth = Number(page.width);
        const pageHeight = Number(page.height);
        planContent.style.width = `${pageWidth}px`;
        planContent.style.height = `${pageHeight}px`;
        planPdfCanvas.style.width = `${pageWidth}px`;
        planPdfCanvas.style.height = `${pageHeight}px`;
        planOverlay.setAttribute("viewBox", `0 0 ${pageWidth} ${pageHeight}`);
        planOverlay.setAttribute("width", String(pageWidth));
        planOverlay.setAttribute("height", String(pageHeight));
        if (pdfCanvas) {
          planPdfCanvas.width = pdfCanvas.width;
          planPdfCanvas.height = pdfCanvas.height;
          const ctx = planPdfCanvas.getContext("2d");
          ctx.clearRect(0, 0, planPdfCanvas.width, planPdfCanvas.height);
          ctx.drawImage(pdfCanvas, 0, 0);
        } else {
          setupBlankPlanPage(page);
        }
        renderPlanTakeoffs();
        const pageLayer = sceneData.page_image_layer || {};
        if (!planPageRegistered) {
          registerVisibilityObject(
            {
              layerUid: pageLayer.uid || page.imageLayerUid,
              layerName: pageLayer.name || IMAGE_LAYER_DISPLAY_NAME,
            },
            planPdfCanvas,
            true,
          );
          planPageRegistered = true;
        } else {
          planPdfCanvas.userData.layerUid = normalizeLayerUid(
            pageLayer.uid || page.imageLayerUid,
          );
          planPdfCanvas.userData.conditionUid = "";
          planPdfCanvas.userData.areaUid = "";
          planPdfCanvas.userData.usesPage3dVisibility = false;
          planPdfCanvas.userData.baseVisible = true;
          setRenderedObjectVisible(
            planPdfCanvas,
            isObjectVisible(planPdfCanvas),
          );
        }
        fitPlanToViewport(forceFit);
        buildLayerPanel();
      }

      function getPdfPageCacheKey(page) {
        return `${page.pdfDocumentUid || ""}:${page.pdfPageIndex || 0}`;
      }

      function loadPdfDocument(documentUid) {
        const uid = normalizeOptionalUid(documentUid);
        if (!uid || !pdfDocuments.has(uid) || typeof pdfjsLib === "undefined") {
          return Promise.resolve(null);
        }
        if (!pdfDocumentPromises.has(uid)) {
          pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          const pdfData = atob(pdfDocuments.get(uid));
          const pdfArray = new Uint8Array(pdfData.length);
          for (let i = 0; i < pdfData.length; i++)
            pdfArray[i] = pdfData.charCodeAt(i);
          pdfDocumentPromises.set(
            uid,
            pdfjsLib.getDocument({ data: pdfArray }).promise,
          );
        }
        return pdfDocumentPromises.get(uid);
      }

      function renderPdfPageCanvas(page) {
        if (!page || !page.pdfDocumentUid) return Promise.resolve(null);
        const cacheKey = getPdfPageCacheKey(page);
        if (pdfPageCanvasCache.has(cacheKey)) {
          return Promise.resolve(pdfPageCanvasCache.get(cacheKey));
        }
        return loadPdfDocument(page.pdfDocumentUid)
          .then((doc) => {
            if (!doc) return null;
            return doc.getPage(Math.min(page.pdfPageIndex + 1, doc.numPages));
          })
          .then((pdfPage) => {
            if (!pdfPage) return null;
            const vp = pdfPage.getViewport({ scale: 3.0 });
            const off = document.createElement("canvas");
            off.width = vp.width;
            off.height = vp.height;
            const ctx = off.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, vp.width, vp.height);
            return pdfPage
              .render({ canvasContext: ctx, viewport: vp })
              .promise.then(() => {
                pdfPageCanvasCache.set(cacheKey, off);
                return off;
              });
          })
          .catch((error) => {
            console.warn("PDF page render failed:", error);
            return null;
          });
      }

      function renderActivePlanPage(forceFit = true) {
        const page = getActivePage();
        if (!page) {
          planModeButton.disabled = true;
          pageCombo.classList.add("disabled");
          return;
        }
        renderPdfPageCanvas(page).then((pdfCanvas) => {
          if (page.uid !== activePageUid) return;
          setupPlanView(pdfCanvas, forceFit);
        });
      }

      function updatePageComboRows() {
        if (!pageComboMenu) return;
        pageComboMenu.querySelectorAll(".page-combo-row").forEach((row) => {
          const pageUid = row.dataset.pageUid || "";
          const entry = page3dVisibility.get(pageUid);
          const visible = entry ? entry.visible !== false : true;
          const checkbox = row.querySelector('input[type="checkbox"]');
          if (checkbox) checkbox.checked = visible;
          row.classList.toggle("disabled", !visible);
          row.classList.toggle("active", pageUid === activePageUid);
        });
        const activePage = getActivePage();
        pageComboButton.textContent = activePage ? activePage.label : "Page";
      }

      function setPage3dVisible(pageUid, visible) {
        const uid = normalizeOptionalUid(pageUid);
        const entry = page3dVisibility.get(uid);
        if (!entry) return;
        entry.visible = Boolean(visible);
        applyObjectVisibility();
      }

      function buildPageCombo() {
        pageComboMenu.innerHTML = "";
        runtimePages.forEach((page) => {
          const row = document.createElement("div");
          row.className = "page-combo-row";
          row.dataset.pageUid = page.uid;
          row.setAttribute("role", "option");

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.setAttribute("aria-label", `Show ${page.label} in 3D`);
          checkbox.addEventListener("click", (event) =>
            event.stopPropagation(),
          );
          checkbox.addEventListener("change", (event) => {
            event.stopPropagation();
            setPage3dVisible(page.uid, checkbox.checked);
          });

          const name = document.createElement("button");
          name.type = "button";
          name.className = "page-combo-name";
          name.textContent = page.label;
          name.title = page.label;
          name.addEventListener("click", (event) => {
            event.stopPropagation();
            setActivePlanPage(page.uid);
            pageCombo.classList.remove("open");
            pageComboButton.setAttribute("aria-expanded", "false");
          });

          row.append(checkbox, name);
          pageComboMenu.appendChild(row);
        });
        pageCombo.classList.toggle("disabled", runtimePages.length === 0);
        updatePageComboRows();
      }

      function setActivePlanPage(pageUid) {
        const target = normalizeOptionalUid(pageUid);
        if (!runtimePages.some((page) => page.uid === target)) return;
        activePageUid = target;
        updatePageComboRows();
        planState.userInteracted = false;
        renderActivePlanPage(true);
        updatePdfPlaneForActivePage();
        applyObjectVisibility();
      }

      pageComboButton.addEventListener("click", (event) => {
        event.stopPropagation();
        const open = !pageCombo.classList.contains("open");
        pageCombo.classList.toggle("open", open);
        pageComboButton.setAttribute("aria-expanded", String(open));
      });
      document.addEventListener("click", (event) => {
        if (!pageCombo.contains(event.target)) {
          pageCombo.classList.remove("open");
          pageComboButton.setAttribute("aria-expanded", "false");
        }
      });

      planView.addEventListener(
        "wheel",
        (event) => {
          if (!hasPlanData) return;
          event.preventDefault();
          planState.userInteracted = true;
          const rect = planView.getBoundingClientRect();
          const pointerX = event.clientX - rect.left;
          const pointerY = event.clientY - rect.top;
          const worldX = (pointerX - planState.offsetX) / planState.scale;
          const worldY = (pointerY - planState.offsetY) / planState.scale;
          const nextScale = clamp(
            planState.scale * Math.exp(-event.deltaY * PLAN_WHEEL_SENSITIVITY),
            PLAN_MIN_SCALE,
            PLAN_MAX_SCALE,
          );
          planState.scale = nextScale;
          planState.offsetX = pointerX - worldX * nextScale;
          planState.offsetY = pointerY - worldY * nextScale;
          setPlanTransform();
        },
        { passive: false },
      );

      planView.addEventListener("pointerdown", (event) => {
        if (!hasPlanData || event.button !== 0) return;
        planState.userInteracted = true;
        planState.isPanning = true;
        planState.panStartX = event.clientX;
        planState.panStartY = event.clientY;
        planState.startOffsetX = planState.offsetX;
        planState.startOffsetY = planState.offsetY;
        planView.classList.add("panning");
        planView.setPointerCapture(event.pointerId);
      });

      planView.addEventListener("pointermove", (event) => {
        if (!planState.isPanning) return;
        planState.offsetX =
          planState.startOffsetX + event.clientX - planState.panStartX;
        planState.offsetY =
          planState.startOffsetY + event.clientY - planState.panStartY;
        setPlanTransform();
      });

      function endPlanPan(event) {
        if (!planState.isPanning) return;
        planState.isPanning = false;
        planView.classList.remove("panning");
        if (event && planView.hasPointerCapture(event.pointerId)) {
          planView.releasePointerCapture(event.pointerId);
        }
      }

      planView.addEventListener("pointerup", endPlanPan);
      planView.addEventListener("pointercancel", endPlanPan);

      function readVector3(values, fallback) {
        if (Array.isArray(values) && values.length >= 3) {
          const x = Number(values[0]);
          const y = Number(values[1]);
          const z = Number(values[2]);
          if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)) {
            return new THREE.Vector3(x, y, z);
          }
        }
        return fallback.clone();
      }

      function getBoxCorners(box) {
        const min = box.min;
        const max = box.max;
        return [
          new THREE.Vector3(min.x, min.y, min.z),
          new THREE.Vector3(min.x, min.y, max.z),
          new THREE.Vector3(min.x, max.y, min.z),
          new THREE.Vector3(min.x, max.y, max.z),
          new THREE.Vector3(max.x, min.y, min.z),
          new THREE.Vector3(max.x, min.y, max.z),
          new THREE.Vector3(max.x, max.y, min.z),
          new THREE.Vector3(max.x, max.y, max.z),
        ];
      }

      function buildClippingBounds(center, radius, box) {
        const depthPadding = Math.max(radius * 0.05, 1.0);
        const nearBoxPadding = Math.max(radius * 0.02, 0.5);
        const depthBox = box.clone().expandByScalar(depthPadding);
        const nearBox = box.clone().expandByScalar(nearBoxPadding);
        return {
          center: center,
          radius: radius,
          minNear: Math.max(radius / 10000.0, 0.01),
          box: box,
          depthPadding: depthPadding,
          nearBox: nearBox,
          depthCorners: getBoxCorners(depthBox),
        };
      }

      function getPagePlaneBox(pageWidth, pageHeight, modelBox) {
        if (!(pageWidth > 0.0 && pageHeight > 0.0)) {
          return null;
        }

        const pagePadding = Math.max(
          Math.max(pageWidth, pageHeight) * 0.001,
          0.05,
        );
        const floorY = modelBox ? modelBox.min.y - 0.01 : -0.01;
        return new THREE.Box3(
          new THREE.Vector3(-pageWidth, floorY - pagePadding, -pageHeight),
          new THREE.Vector3(0.0, floorY + pagePadding, 0.0),
        );
      }

      function getSceneClippingBounds(bounds, pageWidth, pageHeight) {
        const fallbackCenter = readVector3(
          sceneData.camera && sceneData.camera.target,
          new THREE.Vector3(),
        );
        const fallbackRadius = 1000.0;
        const fallbackBox = new THREE.Box3(
          new THREE.Vector3(
            fallbackCenter.x - fallbackRadius,
            fallbackCenter.y - fallbackRadius,
            fallbackCenter.z - fallbackRadius,
          ),
          new THREE.Vector3(
            fallbackCenter.x + fallbackRadius,
            fallbackCenter.y + fallbackRadius,
            fallbackCenter.z + fallbackRadius,
          ),
        );
        const buildFromBox = (box) => {
          const pageBox = getPagePlaneBox(pageWidth, pageHeight, box);
          const clippingBox = pageBox ? box.clone().union(pageBox) : box;
          const sphere = new THREE.Sphere();
          clippingBox.getBoundingSphere(sphere);
          const radius = Math.max(sphere.radius, 1.0);
          return buildClippingBounds(sphere.center, radius, clippingBox);
        };

        if (!bounds || !bounds.min || !bounds.max) {
          return buildFromBox(fallbackBox);
        }

        const min = readVector3(bounds.min, fallbackCenter);
        const max = readVector3(bounds.max, fallbackCenter);
        if (min.x > max.x || min.y > max.y || min.z > max.z) {
          return buildFromBox(fallbackBox);
        }

        const box = new THREE.Box3(min, max);
        return buildFromBox(box);
      }

      // Cranes extend the clipping volume only; camera fit and section-cut extents
      // keep using the takeoff bounds, like the native viewer.
      function unionSceneBounds(bounds, extra) {
        const valid = (b) =>
          b &&
          Array.isArray(b.min) &&
          Array.isArray(b.max) &&
          b.min.length === 3 &&
          b.max.length === 3 &&
          b.min.concat(b.max).every((v) => Number.isFinite(Number(v)));
        if (!valid(extra)) return bounds;
        if (!valid(bounds)) return extra;
        return {
          min: bounds.min.map((v, i) =>
            Math.min(Number(v), Number(extra.min[i])),
          ),
          max: bounds.max.map((v, i) =>
            Math.max(Number(v), Number(extra.max[i])),
          ),
        };
      }

      const sceneClippingBounds = getSceneClippingBounds(
        unionSceneBounds(
          sceneData.bounds,
          sceneData.tower_cranes && sceneData.tower_cranes.render_bounds,
        ),
        maxPageW,
        maxPageH,
      );
      const camera = new THREE.PerspectiveCamera(
        45,
        getViewportWidth() / getViewportHeight(),
        sceneClippingBounds.minNear,
        sceneClippingBounds.radius * 10.0,
      );
      camera.position.set(
        sceneData.camera.position[0],
        sceneData.camera.position[1],
        sceneData.camera.position[2],
      );

      const controls = new OrbitControls(camera, canvas);
      controls.target.set(
        sceneData.camera.target[0],
        sceneData.camera.target[1],
        sceneData.camera.target[2],
      );
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = Math.max(sceneClippingBounds.radius * 100.0, 1.0);
      controls.update();
      const initialCameraPosition = camera.position.clone();
      const initialCameraTarget = controls.target.clone();

      function resetView() {
        if (document.body.classList.contains("plan-mode")) {
          planState.userInteracted = false;
          fitPlanToViewport(true);
          return;
        }
        camera.position.copy(initialCameraPosition);
        controls.target.copy(initialCameraTarget);
        controls.update();
        updateCameraClipping(true);
      }

      function setViewMode(mode) {
        const usePlan = mode === "plan" && hasPlanData;
        document.body.classList.toggle("plan-mode", usePlan);
        controls.enabled = !usePlan;
        planModeButton.classList.toggle("active", usePlan);
        threeModeButton.classList.toggle("active", !usePlan);
        planModeButton.setAttribute("aria-pressed", String(usePlan));
        threeModeButton.setAttribute("aria-pressed", String(!usePlan));
        viewResetButton.textContent = usePlan ? "Fit page" : "Reset view";
        viewTip.textContent = usePlan ? TIP_PLAN : TIP_3D;
        if (usePlan) fitPlanToViewport(false);
      }

      if (!hasPlanData) planModeButton.disabled = true;
      planModeButton.addEventListener("click", () => setViewMode("plan"));
      threeModeButton.addEventListener("click", () => setViewMode("3d"));
      viewResetButton.addEventListener("click", resetView);
      setViewMode("3d");

      function getSceneDepthRange() {
        if (sceneClippingBounds.nearBox.containsPoint(camera.position)) {
          return null;
        }

        const viewDirection = new THREE.Vector3();
        camera.getWorldDirection(viewDirection);
        let nearest = Infinity;
        let farthest = 0.0;
        let cornersBehindCamera = 0;

        for (const corner of sceneClippingBounds.depthCorners) {
          const depth = corner.clone().sub(camera.position).dot(viewDirection);
          if (depth <= sceneClippingBounds.minNear) {
            cornersBehindCamera += 1;
          } else {
            nearest = Math.min(nearest, depth);
            farthest = Math.max(farthest, depth);
          }
        }

        if (
          cornersBehindCamera > 0 ||
          !Number.isFinite(nearest) ||
          farthest <= 0.0 ||
          nearest <= sceneClippingBounds.depthPadding
        ) {
          return null;
        }
        return { nearest: nearest, farthest: farthest };
      }

      function updateCameraClipping(force = false) {
        const baseNear = sceneClippingBounds.minNear;
        const depthRange = getSceneDepthRange();
        let nextNear;
        let nextFar;

        if (depthRange) {
          nextNear = Math.max(
            baseNear,
            depthRange.nearest - sceneClippingBounds.depthPadding,
          );
          nextFar = Math.max(
            nextNear + sceneClippingBounds.radius * 0.25,
            depthRange.farthest + sceneClippingBounds.depthPadding,
            nextNear + 1.0,
          );
        } else {
          const distanceToCenter = camera.position.distanceTo(
            sceneClippingBounds.center,
          );
          const outsideNear =
            distanceToCenter - sceneClippingBounds.radius * 1.5;
          nextNear = Math.max(baseNear, outsideNear);
          nextFar = Math.max(
            nextNear + sceneClippingBounds.radius * 3.0,
            distanceToCenter + sceneClippingBounds.radius * 1.5,
          );
        }

        const nearDelta = Math.abs(camera.near - nextNear);
        const farDelta = Math.abs(camera.far - nextFar);
        const nearThreshold = Math.max(nextNear * 0.001, 0.001);
        const farThreshold = Math.max(nextFar * 0.001, 0.01);

        if (force || nearDelta > nearThreshold || farDelta > farThreshold) {
          camera.near = nextNear;
          camera.far = nextFar;
          camera.updateProjectionMatrix();
        }
      }

      updateCameraClipping(true);

      applyViewerTheme(getViewerTheme());

      themeToggle.addEventListener("click", () => {
        applyViewerTheme(getViewerTheme() === "light" ? "dark" : "light", true);
      });

      window.addEventListener("storage", (event) => {
        if (event.key === THEME_STORAGE_KEY) {
          applyViewerTheme(
            isViewerTheme(event.newValue)
              ? event.newValue
              : getSystemViewerTheme(),
          );
        }
      });

      // Layers: 0 = opaque meshes and the page plane, 1 = transparent meshes, 2 = edge lines.
      const OPAQUE_LAYER = 0;
      const TRANSPARENT_LAYER = 1;
      const EDGE_LAYER = 2;
      const transparentMeshes = [];
      const edgesRoot = new THREE.Group();
      edgesRoot.visible = edgesEnabled;
      scene.add(edgesRoot);

      // Native clip planes (Camera::configure_clip_planes) drive the transparency weight,
      // so the weighted blend matches the native renderer whatever clip planes this page uses.
      function getNativeClipPlanes(bounds) {
        let size = 0.0;
        if (bounds && Array.isArray(bounds.min) && Array.isArray(bounds.max)) {
          for (let i = 0; i < 3; i++) {
            const extent = Number(bounds.max[i]) - Number(bounds.min[i]);
            if (Number.isFinite(extent)) size = Math.max(size, extent);
          }
        }
        if (size < 1.0) size = 100.0;
        return {
          near: Math.max(0.1, size * 0.001),
          far: Math.max(10000.0, size * 20.0),
        };
      }

      const nativeClipPlanes = getNativeClipPlanes(sceneData.bounds);

      // Section cuts (renderer.cpp set_section_cut). Native Z-up maps to this Y-up
      // scene as (x, y, z) -> (x, z, -y): the north-south cut moves along native y
      // (-z here) and removes native y > cut, which is z < -cut here; the east-west
      // cut moves along x and removes x > cut in both viewers.
      const SECTION_CUT_STEPS = 1000;
      const MODEL_UNITS_PER_FOOT = 12.0;
      const SECTION_CAP_INSET = 0.01;
      const SECTION_CAP_SHADE = 0.86;
      const SECTION_PLANE_OFF = 1e12;
      const sectionCutUniform = { value: new THREE.Vector4(0, 0, 0, 0) };
      const sectionPlanes = [
        new THREE.Plane(new THREE.Vector3(0, 0, 1), SECTION_PLANE_OFF),
        new THREE.Plane(new THREE.Vector3(-1, 0, 0), SECTION_PLANE_OFF),
      ];
      const sectionCuts = {
        northSouth: {
          fraction: 1,
          extent: getSectionCutExtent(sceneData.bounds, "northSouth"),
        },
        eastWest: {
          fraction: 1,
          extent: getSectionCutExtent(sceneData.bounds, "eastWest"),
        },
      };
      const sectionCapObjects = [];
      const meshRecords = [];
      // Takeoff and crane meshes the hover info can name (caps are added live).
      const hoverMeshes = [];
      let sectionCapsDirty = false;

      // Native extent of a cut axis: y for north-south (-z here), x for east-west.
      function getSectionCutExtent(bounds, cut) {
        if (
          !bounds ||
          !Array.isArray(bounds.min) ||
          !Array.isArray(bounds.max)
        ) {
          return null;
        }
        const low =
          cut === "northSouth" ? -Number(bounds.max[2]) : Number(bounds.min[0]);
        const high =
          cut === "northSouth" ? -Number(bounds.min[2]) : Number(bounds.max[0]);
        return Number.isFinite(low) && Number.isFinite(high) && high > low
          ? [low, high]
          : null;
      }

      // Native coordinate of an active cut, or null when the cut is off.
      function getSectionCutPosition(cut) {
        const entry = sectionCuts[cut];
        if (!entry.extent || entry.fraction >= 1) return null;
        return (
          entry.extent[0] + entry.fraction * (entry.extent[1] - entry.extent[0])
        );
      }

      function formatSectionCutValue(cut) {
        const position = getSectionCutPosition(cut);
        if (position === null) return "off";
        const feet =
          (position - sectionCuts[cut].extent[0]) / MODEL_UNITS_PER_FOOT;
        return `${feet.toLocaleString(undefined, {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1,
        })}'`;
      }

      function applySectionCuts() {
        const northSouth = getSectionCutPosition("northSouth");
        const eastWest = getSectionCutPosition("eastWest");
        sectionCutUniform.value.set(
          northSouth === null ? 0 : 1,
          northSouth === null ? 0 : -northSouth,
          eastWest === null ? 0 : 1,
          eastWest === null ? 0 : eastWest,
        );
        // Built-in materials (edges, depth pre-pass) keep z >= -northSouth and x <= eastWest.
        sectionPlanes[0].constant =
          northSouth === null ? SECTION_PLANE_OFF : northSouth;
        sectionPlanes[1].constant =
          eastWest === null ? SECTION_PLANE_OFF : eastWest;
        sectionCapsDirty = true;
      }

      function lightUniform(light) {
        return {
          dir: new THREE.Vector3(
            light.dir[0],
            light.dir[1],
            light.dir[2],
          ).normalize(),
          intensity: light.intensity,
        };
      }

      const NATIVE_VERTEX_SHADER = `
      varying vec3 vNativeNormal;
      varying float vViewDepth;
      varying vec3 vWorldPosition;
      void main() {
        vNativeNormal = mat3(modelMatrix) * normal;
        vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
        vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);
        vViewDepth = -viewPosition.z;
        gl_Position = projectionMatrix * viewPosition;
      }
    `;

      const NATIVE_LIGHTING_GLSL = `
      uniform vec3 uColor;
      uniform float uAlpha;
      uniform float uAmbient;
      uniform vec3 uKeyDir;
      uniform float uKeyIntensity;
      uniform vec3 uFillDir;
      uniform float uFillIntensity;
      uniform vec3 uRimDir;
      uniform float uRimIntensity;
      uniform float uNativeNear;
      uniform float uNativeFar;
      uniform vec4 uSectionCut;
      varying vec3 vNativeNormal;
      varying float vViewDepth;
      varying vec3 vWorldPosition;
      bool sectionCutRemoved() {
        return (uSectionCut.x > 0.5 && vWorldPosition.z < uSectionCut.y)
          || (uSectionCut.z > 0.5 && vWorldPosition.x > uSectionCut.w);
      }
      vec3 nativeLitColor() {
        vec3 norm = normalize(vNativeNormal);
        float keyDiff = max(dot(norm, uKeyDir), 0.0);
        float fillDiff = max(dot(norm, uFillDir), 0.0);
        float rimDiff = max(dot(norm, uRimDir), 0.0);
        vec3 lighting = vec3(uAmbient) + uKeyIntensity * keyDiff * vec3(1.0)
          + uFillIntensity * fillDiff * vec3(1.0) + uRimIntensity * rimDiff * vec3(1.0);
        return lighting * uColor;
      }
      float nativeWindowDepth() {
        float d = max(vViewDepth, 1e-6);
        float ndc = (uNativeFar + uNativeNear) / (uNativeFar - uNativeNear)
          - (2.0 * uNativeFar * uNativeNear) / ((uNativeFar - uNativeNear) * d);
        return clamp(ndc * 0.5 + 0.5, 0.0, 1.0);
      }
      float nativeWeight(float alpha) {
        float z = nativeWindowDepth();
        return alpha * max(1e-2, 3e3 * pow(1.0 - z, 3.0));
      }
    `;

      const NATIVE_FRAGMENT_SHADERS = {
        opaque: `${NATIVE_LIGHTING_GLSL}
        void main() {
          if (sectionCutRemoved()) discard;
          gl_FragColor = vec4(nativeLitColor(), uAlpha);
        }`,
        accum: `${NATIVE_LIGHTING_GLSL}
        void main() {
          if (sectionCutRemoved()) discard;
          float w = nativeWeight(uAlpha);
          gl_FragColor = vec4(nativeLitColor() * uAlpha, uAlpha) * w;
        }`,
        revealage: `${NATIVE_LIGHTING_GLSL}
        void main() {
          if (sectionCutRemoved()) discard;
          float w = nativeWeight(uAlpha);
          gl_FragColor = vec4(vec3(uAlpha * w), 1.0);
        }`,
      };

      function createNativeMaterial(kind, color, alpha) {
        const key = lightUniform(NATIVE_KEY_LIGHT);
        const fill = lightUniform(NATIVE_FILL_LIGHT);
        const rim = lightUniform(NATIVE_RIM_LIGHT);
        const material = new THREE.ShaderMaterial({
          uniforms: {
            uColor: { value: new THREE.Vector3(color[0], color[1], color[2]) },
            uAlpha: { value: alpha },
            uAmbient: { value: NATIVE_AMBIENT_INTENSITY },
            uKeyDir: { value: key.dir },
            uKeyIntensity: { value: key.intensity },
            uFillDir: { value: fill.dir },
            uFillIntensity: { value: fill.intensity },
            uRimDir: { value: rim.dir },
            uRimIntensity: { value: rim.intensity },
            uNativeNear: { value: nativeClipPlanes.near },
            uNativeFar: { value: nativeClipPlanes.far },
            uSectionCut: sectionCutUniform,
          },
          vertexShader: NATIVE_VERTEX_SHADER,
          fragmentShader:
            NATIVE_FRAGMENT_SHADERS[kind === "fallback" ? "opaque" : kind],
          side: THREE.DoubleSide,
        });
