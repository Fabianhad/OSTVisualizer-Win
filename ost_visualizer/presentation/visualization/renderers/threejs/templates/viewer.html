        if (kind === "fallback") {
          material.transparent = true;
          material.depthWrite = false;
        } else if (kind === "opaque") {
          material.polygonOffset = true;
          material.polygonOffsetFactor = 1;
          material.polygonOffsetUnits = 1;
        } else {
          material.transparent = true;
          material.depthWrite = false;
          material.blending = THREE.CustomBlending;
          material.blendEquation = THREE.AddEquation;
          if (kind === "accum") {
            material.blendSrc = THREE.OneFactor;
            material.blendDst = THREE.OneFactor;
          } else {
            material.blendSrc = THREE.ZeroFactor;
            material.blendDst = THREE.OneMinusSrcColorFactor;
          }
        }
        return material;
      }

      function readColor(values) {
        const color = Array.isArray(values)
          ? values.slice(0, 3).map(Number)
          : [];
        return color.length === 3 && color.every(Number.isFinite)
          ? color
          : [0.5, 0.5, 0.5];
      }

      function createEdgeLines(geometry, color, keys, baseVisible) {
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(geometry, EDGE_THRESHOLD_DEGREES),
          new THREE.LineBasicMaterial({
            color: new THREE.Color(
              color[0] * EDGE_COLOR_SCALE,
              color[1] * EDGE_COLOR_SCALE,
              color[2] * EDGE_COLOR_SCALE,
            ),
            depthWrite: false,
            toneMapped: false,
            clippingPlanes: sectionPlanes,
          }),
        );
        edges.layers.set(EDGE_LAYER);
        edgesRoot.add(edges);
        registerVisibilityObject(keys, edges, baseVisible);
      }

      sceneData.geometries.forEach((geomData) => {
        const geometry = new THREE.BufferGeometry();
        const vertices = new Float32Array(geomData.vertices);
        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(vertices, 3),
        );
        let normals;
        if (
          geomData.normals &&
          geomData.normals.length === geomData.vertices.length
        ) {
          normals = new Float32Array(geomData.normals);
        } else {
          // The native renderer defaults a missing normal to +Z (Z-up), which is +Y here.
          normals = new Float32Array(vertices.length);
          for (let i = 1; i < normals.length; i += 3) normals[i] = 1.0;
        }
        geometry.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
        geometry.setIndex(
          new THREE.BufferAttribute(new Uint32Array(geomData.indices), 1),
        );
        const color = readColor(geomData.color);
        const opacity = Number.isFinite(Number(geomData.opacity))
          ? Number(geomData.opacity)
          : 1.0;
        const isTransparent = opacity < NATIVE_TRANSPARENT_ALPHA;
        const layerUid = normalizeLayerUid(geomData.layer_uid);
        let mesh;
        if (isTransparent) {
          mesh = new THREE.Mesh(
            geometry,
            createNativeMaterial("accum", color, opacity),
          );
          mesh.userData.accumMaterial = mesh.material;
          mesh.userData.revealageMaterial = createNativeMaterial(
            "revealage",
            color,
            opacity,
          );
          mesh.userData.fallbackMaterial = createNativeMaterial(
            "fallback",
            color,
            opacity,
          );
          mesh.layers.set(TRANSPARENT_LAYER);
          transparentMeshes.push(mesh);
        } else {
          mesh = new THREE.Mesh(
            geometry,
            createNativeMaterial("opaque", color, opacity),
          );
          mesh.layers.set(OPAQUE_LAYER);
        }
        scene.add(mesh);
        mesh.userData.takeoffUid = geomData.takeoff_uid || "";
        const keys = {
          pageUid: geomData.page_uid,
          pageName: (
            page3dVisibility.get(normalizeOptionalUid(geomData.page_uid)) || {}
          ).name,
          usesPage3dVisibility: true,
          layerUid: layerUid,
          conditionUid: geomData.condition_uid,
          conditionName: geomData.name,
          areaUid: geomData.area_uid,
        };
        registerVisibilityObject(keys, mesh, geomData.visible !== false);
        createEdgeLines(geometry, color, keys, geomData.visible !== false);
        mesh.userData.hoverName = String(geomData.hover || geomData.name || "");
        mesh.userData.hoverBottom = String(geomData.hover_bottom || "");
        mesh.userData.hoverTop = String(geomData.hover_top || "");
        mesh.userData.hoverGeometry = {
          positions: vertices,
          index: geometry.index.array,
        };
        hoverMeshes.push(mesh);
        meshRecords.push({
          hoverMesh: mesh,
          positions: vertices,
          index: geometry.index.array,
          color: color,
          opacity: opacity,
          isTransparent: isTransparent,
          keys: keys,
          baseVisible: geomData.visible !== false,
        });
      });

      function setEdgesEnabled(enabled) {
        edgesEnabled = Boolean(enabled);
        edgesRoot.visible = edgesEnabled;
        edgesToggle.checked = edgesEnabled;
      }

      edgesToggle.checked = edgesEnabled;
      edgesToggle.addEventListener("change", () =>
        setEdgesEnabled(edgesToggle.checked),
      );

      const towerCraneData = sceneData.tower_cranes || null;
      const towerCraneToggle = document.getElementById("tower-crane-toggle");
      const towerCraneCredit = document.getElementById("tower-crane-credit");
      const towerCraneControls = [
        document.getElementById("tower-crane-label"),
        towerCraneToggle,
        document.getElementById("tower-crane-spacer"),
      ];

      function showTowerCraneControls(visible) {
        towerCraneControls.forEach((element) => {
          element.hidden = !visible;
        });
        towerCraneCredit.hidden = !visible;
      }

      function setTowerCraneEnabled(enabled) {
        towerCraneEnabled = Boolean(enabled);
        towerCraneToggle.checked = towerCraneEnabled;
        applyObjectVisibility();
      }

      towerCraneToggle.checked = towerCraneEnabled;
      towerCraneToggle.addEventListener("change", () =>
        setTowerCraneEnabled(towerCraneToggle.checked),
      );

      function renderTowerCraneCredit(credit) {
        towerCraneCredit.textContent = "";
        if (!credit) return;
        const link = (text, href) => {
          const anchor = document.createElement("a");
          anchor.textContent = text;
          anchor.href = href;
          anchor.target = "_blank";
          anchor.rel = "noopener";
          return anchor;
        };
        towerCraneCredit.append(
          "Crane model: \u201c",
          link(credit.title, credit.source_url),
          "\u201d by ",
          link(credit.author, credit.author_url),
          ` on ${credit.site}, `,
          link(credit.license, credit.license_url),
          `; ${credit.modified}.`,
        );
      }

      function base64ToArrayBuffer(text) {
        const binary = atob(text);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
      }

      function towerCraneKitParts(gltf) {
        const kit = new Map();
        gltf.scene.updateMatrixWorld(true);
        gltf.scene.children.forEach((child) => {
          const name = (child.userData && child.userData.name) || child.name;
          const part = { meshes: [], lines: [] };
          child.traverse((node) => {
            if (!node.geometry || !(node.isMesh || node.isLineSegments)) return;
            const source = node.geometry.getAttribute("position");
            const sourceNormals = node.isMesh
              ? node.geometry.getAttribute("normal")
              : null;
            const normalMatrix = new THREE.Matrix3().getNormalMatrix(
              node.matrixWorld,
            );
            const positions = new Float32Array(source.count * 3);
            const normals = new Float32Array(source.count * 3);
            const v = new THREE.Vector3();
            for (let i = 0; i < source.count; i++) {
              v.fromBufferAttribute(source, i).applyMatrix4(node.matrixWorld);
              positions.set([v.x, v.y, v.z], i * 3);
              if (sourceNormals) {
                v.fromBufferAttribute(sourceNormals, i)
                  .applyMatrix3(normalMatrix)
                  .normalize();
                normals.set([v.x, v.y, v.z], i * 3);
              }
            }
            const material = node.material || {};
            const entry = {
              positions: positions,
              normals: normals,
              indices: node.geometry.index
                ? Array.from(node.geometry.index.array)
                : Array.from({ length: source.count }, (_, i) => i),
              color: material.color
                ? [material.color.r, material.color.g, material.color.b]
                : [0.7, 0.7, 0.7],
              alpha:
                material.transparent && Number.isFinite(material.opacity)
                  ? material.opacity
                  : 1.0,
            };
            (node.isMesh ? part.meshes : part.lines).push(entry);
          });
          kit.set(name, part);
        });
        return kit;
      }

      // Edges of a kit mesh without baked lines, by the native renderer's rule
      // (renderer.cpp feature_edge_indices): vertices keyed by position, boundary
      // edges plus creases sharper than the threshold, never diagonals.
      function towerCraneFeatureEdges(positions, indices, thresholdDegrees) {
        const ids = [];
        const firstAt = new Map();
        for (let i = 0; i < positions.length / 3; i++) {
          const key = [0, 1, 2]
            .map((k) => Math.round(positions[i * 3 + k] * 1e4))
            .join(",");
          if (!firstAt.has(key)) firstAt.set(key, i);
          ids.push(firstAt.get(key));
        }
        const faceNormal = (t) => {
          const p = (k) =>
            [0, 1, 2].map((c) => positions[indices[t + k] * 3 + c]);
          const [a, b, c] = [p(0), p(1), p(2)];
          const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
          const v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
          const n = [
            u[1] * v[2] - u[2] * v[1],
            u[2] * v[0] - u[0] * v[2],
            u[0] * v[1] - u[1] * v[0],
          ];
          const length = Math.hypot(n[0], n[1], n[2]) || 1;
          return n.map((x) => x / length);
        };
        const crease = Math.cos((thresholdDegrees * Math.PI) / 180);
        const open = new Map();
        const lines = [];
        for (let t = 0; t + 2 < indices.length; t += 3) {
          for (let e = 0; e < 3; e++) {
            const a = indices[t + e];
            const b = indices[t + ((e + 1) % 3)];
            const [ca, cb] = [ids[a], ids[b]];
            if (ca === cb) continue;
            const key = ca < cb ? `${ca}:${cb}` : `${cb}:${ca}`;
            const other = open.get(key);
            if (other === undefined) {
              open.set(key, { face: t, a: a, b: b });
              continue;
            }
            const n1 = faceNormal(other.face);
            const n2 = faceNormal(t);
            if (n1[0] * n2[0] + n1[1] * n2[1] + n1[2] * n2[2] < crease) {
              lines.push(other.a, other.b);
            }
            open.delete(key);
          }
        }
        open.forEach((edge) => lines.push(edge.a, edge.b));
        return lines;
      }

      function towerCraneComputedLines(part) {
        if (!part.computedLines) {
          part.computedLines = part.meshes.map((mesh) => ({
            positions: mesh.positions,
            indices: towerCraneFeatureEdges(
              mesh.positions,
              mesh.indices,
              EDGE_THRESHOLD_DEGREES,
            ),
            color: mesh.color,
            alpha: mesh.alpha,
          }));
        }
        return part.computedLines;
      }

      function towerCraneLayoutParts(kit, layout, unitsPerMetre, withoutEdges) {
        const groups = new Map();
        const groupFor = (color, alpha) => {
          const key = `${color.join(",")}:${alpha}`;
          if (!groups.has(key)) {
            groups.set(key, {
              color: color,
              alpha: alpha,
              positions: [],
              normals: [],
              indices: [],
              edges: [],
            });
          }
          return groups.get(key);
        };
        const names = layout && Array.isArray(layout.parts) ? layout.parts : [];
        const m =
          layout && Array.isArray(layout.matrices) ? layout.matrices : [];
        names.forEach((name, item) => {
          const part = kit.get(name);
          const o = item * 12;
          if (!part || m.length < o + 12) return;
          const place = (x, y, z) => [
            -(m[o] * x + m[o + 1] * y + m[o + 2] * z + m[o + 3]) *
              unitsPerMetre,
            (m[o + 4] * x + m[o + 5] * y + m[o + 6] * z + m[o + 7]) *
              unitsPerMetre,
            -(m[o + 8] * x + m[o + 9] * y + m[o + 10] * z + m[o + 11]) *
              unitsPerMetre,
          ];
          const turn = (x, y, z) => {
            const nx =
              (m[o + 5] * m[o + 10] - m[o + 6] * m[o + 9]) * x +
              (m[o + 6] * m[o + 8] - m[o + 4] * m[o + 10]) * y +
              (m[o + 4] * m[o + 9] - m[o + 5] * m[o + 8]) * z;
            const ny =
              (m[o + 2] * m[o + 9] - m[o + 1] * m[o + 10]) * x +
              (m[o] * m[o + 10] - m[o + 2] * m[o + 8]) * y +
              (m[o + 1] * m[o + 8] - m[o] * m[o + 9]) * z;
            const nz =
              (m[o + 1] * m[o + 6] - m[o + 2] * m[o + 5]) * x +
              (m[o + 2] * m[o + 4] - m[o] * m[o + 6]) * y +
              (m[o] * m[o + 5] - m[o + 1] * m[o + 4]) * z;
            const length = Math.hypot(nx, ny, nz) || 1;
            return [-nx / length, ny / length, -nz / length];
          };
          part.meshes.forEach((mesh) => {
            const group = groupFor(mesh.color, mesh.alpha);
            const base = group.positions.length / 3;
            for (let i = 0; i < mesh.positions.length; i += 3) {
              const p = place(
                mesh.positions[i],
                mesh.positions[i + 1],
                mesh.positions[i + 2],
              );
              const n = turn(
                mesh.normals[i],
                mesh.normals[i + 1],
                mesh.normals[i + 2],
              );
              group.positions.push(p[0], p[1], p[2]);
              group.normals.push(n[0], n[1], n[2]);
            }
            for (let i = 0; i < mesh.indices.length; i++) {
              group.indices.push(base + mesh.indices[i]);
            }
          });
          if (withoutEdges && withoutEdges.has(name)) return;
          // Baked lines replace computed edges part by part, as in the native viewer.
          const lines = part.lines.length
            ? part.lines
            : towerCraneComputedLines(part);
          lines.forEach((line) => {
            const group = groupFor(line.color, line.alpha);
            for (let i = 0; i < line.indices.length; i++) {
              const at = line.indices[i] * 3;
              const p = place(
                line.positions[at],
                line.positions[at + 1],
                line.positions[at + 2],
              );
              group.edges.push(p[0], p[1], p[2]);
            }
          });
        });
        return Array.from(groups.values());
      }

      function towerCraneGeometries(group) {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(group.positions), 3),
        );
        geometry.setAttribute(
          "normal",
          new THREE.BufferAttribute(new Float32Array(group.normals), 3),
        );
        geometry.setIndex(
          new THREE.BufferAttribute(new Uint32Array(group.indices), 1),
        );
        let edgesGeometry = null;
        if (group.edges.length) {
          edgesGeometry = new THREE.BufferGeometry();
          edgesGeometry.setAttribute(
            "position",
            new THREE.BufferAttribute(new Float32Array(group.edges), 3),
          );
        }
        return {
          geometry: geometry,
          edgesGeometry: edgesGeometry,
          color: group.color,
          alpha: group.alpha,
        };
      }

      function towerCranePlacementKeys(placement) {
        return {
          pageUid: placement.page_uid,
          usesPage3dVisibility: true,
          layerUid: normalizeLayerUid(placement.layer_uid),
          conditionUid: placement.condition_uid,
          areaUid: placement.area_uid,
        };
      }

      function addTowerCraneObject(object, keys) {
        object.userData.towerCrane = true;
        registerVisibilityObject(keys, object, true);
      }

      function placeTowerCranes(layouts, placements) {
        const materials = new Map();
        const materialFor = (kind, color, alpha) => {
          const key = `${kind}:${color.join(",")}:${alpha}`;
          if (!materials.has(key)) {
            materials.set(key, createNativeMaterial(kind, color, alpha));
          }
          return materials.get(key);
        };
        const edgeMaterials = new Map();
        const edgeMaterialFor = (color) => {
          const key = color.join(",");
          if (!edgeMaterials.has(key)) {
            edgeMaterials.set(
              key,
              new THREE.LineBasicMaterial({
                color: new THREE.Color(
                  color[0] * EDGE_COLOR_SCALE,
                  color[1] * EDGE_COLOR_SCALE,
                  color[2] * EDGE_COLOR_SCALE,
                ),
                depthWrite: false,
                toneMapped: false,
                clippingPlanes: sectionPlanes,
              }),
            );
          }
          return edgeMaterials.get(key);
        };
        let placed = 0;
        placements.forEach((placement) => {
          const position = readVector3(
            placement.position,
            new THREE.Vector3(NaN, NaN, NaN),
          );
          const rotation = Number(placement.rotation_y);
          if (!Number.isFinite(position.x) || !Number.isFinite(rotation))
            return;
          const tint =
            Array.isArray(placement.tint) && placement.tint.length === 3
              ? readColor(placement.tint)
              : null;
          const parts = layouts[Number(placement.layout)];
          if (!parts) return;
          const keys = towerCranePlacementKeys(placement);
          const group = new THREE.Group();
          const edgeGroup = new THREE.Group();
          [group, edgeGroup].forEach((target) => {
            target.position.copy(position);
            target.rotation.y = rotation;
          });
          scene.add(group);
          edgesRoot.add(edgeGroup);
          parts.forEach((part) => {
            const color = tint || part.color;
            let mesh;
            if (part.alpha < NATIVE_TRANSPARENT_ALPHA) {
              mesh = new THREE.Mesh(
                part.geometry,
                materialFor("accum", color, part.alpha),
              );
              mesh.userData.accumMaterial = mesh.material;
              mesh.userData.revealageMaterial = materialFor(
                "revealage",
                color,
                part.alpha,
              );
              mesh.userData.fallbackMaterial = materialFor(
                "fallback",
                color,
                part.alpha,
              );
              mesh.layers.set(TRANSPARENT_LAYER);
              transparentMeshes.push(mesh);
            } else {
              mesh = new THREE.Mesh(
                part.geometry,
                materialFor("opaque", color, 1.0),
              );
              mesh.layers.set(OPAQUE_LAYER);
            }
            group.add(mesh);
            addTowerCraneObject(mesh, keys);
            mesh.userData.hoverName = String(placement.hover || "");
            hoverMeshes.push(mesh);
            if (!part.edgesGeometry) return;
            const edges = new THREE.LineSegments(
              part.edgesGeometry,
              edgeMaterialFor(color),
            );
            edges.layers.set(EDGE_LAYER);
            edgeGroup.add(edges);
            addTowerCraneObject(edges, keys);
          });
          placed += 1;
        });
        return placed;
      }

      function loadTowerCranes() {
        const placements =
          towerCraneData && Array.isArray(towerCraneData.placements)
            ? towerCraneData.placements
            : [];
        if (!placements.length || !towerCraneData.model_base64) return;
        const unitsPerMetre = Number(towerCraneData.units_per_metre);
        if (!(unitsPerMetre > 0)) return;
        renderTowerCraneCredit(towerCraneData.credit);
        let buffer;
        try {
          buffer = base64ToArrayBuffer(towerCraneData.model_base64);
        } catch (error) {
          console.warn("Tower crane model could not be decoded", error);
          showTowerCraneControls(false);
          return;
        }
        import("three/addons/loaders/GLTFLoader.js")
          .then(
            ({ GLTFLoader }) =>
              new Promise((resolve, reject) =>
                new GLTFLoader().parse(buffer, "", resolve, reject),
              ),
          )
          .then((gltf) => {
            const kit = towerCraneKitParts(gltf);
            // Parts the kit marks "edges": false (the rope) draw no edge lines.
            const withoutEdges = new Set(
              towerCraneData.parts_without_edges || [],
            );
            const layouts = (
              Array.isArray(towerCraneData.layouts)
                ? towerCraneData.layouts
                : []
            ).map((layout) =>
              towerCraneLayoutParts(
                kit,
                layout,
                unitsPerMetre,
                withoutEdges,
              ).map(towerCraneGeometries),
            );
            // The toggle and credit appear only once a crane is on screen.
            showTowerCraneControls(placeTowerCranes(layouts, placements) > 0);
          })
          .catch((error) => {
            console.warn("Tower crane model could not be loaded", error);
            showTowerCraneControls(false);
          });
      }

      loadTowerCranes();

      function ringArea(ring) {
        let area = 0;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          area += (ring[j][0] - ring[i][0]) * (ring[j][1] + ring[i][1]);
        }
        return area * 0.5;
      }

      function ringContains(ring, point) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const a = ring[i];
          const b = ring[j];
          if (
            a[1] > point[1] !== b[1] > point[1] &&
            point[0] <
              ((b[0] - a[0]) * (point[1] - a[1])) / (b[1] - a[1]) + a[0]
          ) {
            inside = !inside;
          }
        }
        return inside;
      }

      // Slices a mesh with coordinate[axis] == plane (axis 0 = x, 2 = z) and returns
      // the closed cross-section loops as [u, v] points (u along z or x, v along y).
      // Open chains from meshes that are not closed are skipped.
      function sliceMeshLoops(positions, index, axis, plane) {
        const uAxis = axis === 0 ? 2 : 0;
        const coord = (i, c) => positions[i * 3 + c];
        const before = (a, b) => {
          for (let c = 0; c < 3; c++) {
            const ca = coord(a, c);
            const cb = coord(b, c);
            if (ca !== cb) return ca < cb;
          }
          return a < b;
        };
        const segments = [];
        for (let t = 0; t + 2 < index.length; t += 3) {
          const tri = [index[t], index[t + 1], index[t + 2]];
          const d = tri.map((i) => {
            const value = coord(i, axis) - plane;
            return value === 0 ? 1e-12 : value;
          });
          const hits = [];
          for (let k = 0; k < 3 && hits.length < 2; k++) {
            const j = (k + 1) % 3;
            if (d[k] > 0 === d[j] > 0) continue;
            let a = tri[k];
            let b = tri[j];
            let da = d[k];
            let db = d[j];
            // Same edge, same arithmetic: neighbours get identical points.
            if (before(b, a)) {
              [a, b] = [b, a];
              [da, db] = [db, da];
            }
            const s = da / (da - db);
            hits.push([
              coord(a, uAxis) + s * (coord(b, uAxis) - coord(a, uAxis)),
              coord(a, 1) + s * (coord(b, 1) - coord(a, 1)),
            ]);
          }
          if (hits.length === 2) segments.push(hits);
        }
        const keyOf = (p) =>
          `${Math.round(p[0] * 1e4)},${Math.round(p[1] * 1e4)}`;
        const at = new Map();
        const used = new Array(segments.length).fill(false);
        segments.forEach((segment, s) => {
          const ka = keyOf(segment[0]);
          const kb = keyOf(segment[1]);
          if (ka === kb) {
            used[s] = true;
            return;
          }
          [ka, kb].forEach((key) => {
            if (!at.has(key)) at.set(key, []);
            at.get(key).push(s);
          });
        });
        const loops = [];
        for (let s = 0; s < segments.length; s++) {
          if (used[s]) continue;
          used[s] = true;
          const loop = [segments[s][0], segments[s][1]];
          const start = keyOf(segments[s][0]);
          let current = keyOf(segments[s][1]);
          let closed = false;
          for (let guard = 0; guard <= segments.length; guard++) {
            if (current === start) {
              closed = true;
              break;
            }
            const next = (at.get(current) || []).find(
              (candidate) => !used[candidate],
            );
            if (next === undefined) break;
            used[next] = true;
            const other =
              keyOf(segments[next][0]) === current
                ? segments[next][1]
                : segments[next][0];
            loop.push(other);
            current = keyOf(other);
          }
          if (!closed) continue;
          loop.pop();
          if (loop.length >= 3 && Math.abs(ringArea(loop)) > 1e-9)
            loops.push(loop);
        }
        return loops;
      }

      // Even nesting depth is an outline, odd depth a hole of its smallest container.
      function nestSectionLoops(loops) {
        const areas = loops.map((loop) => Math.abs(ringArea(loop)));
        const parent = loops.map(() => -1);
        const depth = loops.map(() => 0);
        loops.forEach((loop, i) => {
          loops.forEach((other, j) => {
            if (
              i === j ||
              areas[j] <= areas[i] ||
              !ringContains(other, loop[0])
            ) {
              return;
            }
            depth[i] += 1;
            if (parent[i] < 0 || areas[j] < areas[parent[i]]) parent[i] = j;
          });
        });
        const polygons = [];
        loops.forEach((loop, i) => {
          if (depth[i] % 2 !== 0) return;
          polygons.push({
            outer: loop,
            holes: loops.filter(
              (_, h) => depth[h] % 2 !== 0 && parent[h] === i,
            ),
          });
        });
        return polygons;
      }

      function clearSectionCaps() {
        if (!sectionCapObjects.length) return;
        const removed = new Set(sectionCapObjects);
        for (let i = visibilityObjects.length - 1; i >= 0; i--) {
          if (removed.has(visibilityObjects[i])) visibilityObjects.splice(i, 1);
        }
        for (let i = transparentMeshes.length - 1; i >= 0; i--) {
          if (removed.has(transparentMeshes[i])) transparentMeshes.splice(i, 1);
        }
        sectionCapObjects.forEach((object) => {
          if (object.parent) object.parent.remove(object);
          object.geometry.dispose();
          // The mesh may still hold its fallback material, so dispose each one once.
          new Set([
            object.material,
            object.userData.accumMaterial,
            object.userData.revealageMaterial,
            object.userData.fallbackMaterial,
          ]).forEach((material) => {
            if (material) material.dispose();
          });
        });
        sectionCapObjects.length = 0;
      }

      // Caps fill the cut faces (renderer.cpp ensure_caps): a little darker than the
      // element, just inside the kept side, outlined with the element's edge colour.
      function rebuildSectionCaps() {
        clearSectionCaps();
        const northSouth = getSectionCutPosition("northSouth");
        const eastWest = getSectionCutPosition("eastWest");
        const cuts = [];
        if (northSouth !== null) {
          cuts.push({
            axis: 2,
            plane: -northSouth + SECTION_CAP_INSET,
            normal: [0, 0, -1],
          });
        }
        if (eastWest !== null) {
          cuts.push({
            axis: 0,
            plane: eastWest - SECTION_CAP_INSET,
            normal: [1, 0, 0],
          });
        }
        if (!cuts.length) return;
        meshRecords.forEach((record) => {
          const positions = [];
          const normals = [];
          const indices = [];
          const linePositions = [];
          cuts.forEach((cut) => {
            const uAxis = cut.axis === 0 ? 2 : 0;
            const toPoint = (point) => {
              const xyz = [0, 0, 0];
              xyz[cut.axis] = cut.plane;
              xyz[uAxis] = point.x;
              xyz[1] = point.y;
              return xyz;
            };
            const loops = sliceMeshLoops(
              record.positions,
              record.index,
              cut.axis,
              cut.plane,
            );
            nestSectionLoops(loops).forEach((polygon) => {
              const toVectors = (ring) =>
                ring.map((point) => new THREE.Vector2(point[0], point[1]));
              const outer = toVectors(polygon.outer);
              const holes = polygon.holes.map(toVectors);
              const faces = THREE.ShapeUtils.triangulateShape(outer, holes);
              const base = positions.length / 3;
              [outer, ...holes].forEach((ring) => {
                ring.forEach((point, k) => {
                  positions.push(...toPoint(point));
                  normals.push(...cut.normal);
                  linePositions.push(
                    ...toPoint(point),
                    ...toPoint(ring[(k + 1) % ring.length]),
                  );
                });
              });
              faces.forEach((face) => {
                indices.push(base + face[0], base + face[1], base + face[2]);
              });
            });
          });
          if (!indices.length) return;
          const capColor = record.color.map(
            (value) => value * SECTION_CAP_SHADE,
          );
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(positions, 3),
          );
          geometry.setAttribute(
            "normal",
            new THREE.Float32BufferAttribute(normals, 3),
          );
          geometry.setIndex(indices);
          let cap;
          if (record.isTransparent) {
            cap = new THREE.Mesh(
              geometry,
              createNativeMaterial("accum", capColor, record.opacity),
            );
            cap.userData.accumMaterial = cap.material;
            cap.userData.revealageMaterial = createNativeMaterial(
              "revealage",
              capColor,
              record.opacity,
            );
            cap.userData.fallbackMaterial = createNativeMaterial(
              "fallback",
              capColor,
              record.opacity,
            );
            cap.layers.set(TRANSPARENT_LAYER);
            transparentMeshes.push(cap);
          } else {
            cap = new THREE.Mesh(
              geometry,
              createNativeMaterial("opaque", capColor, record.opacity),
            );
            cap.layers.set(OPAQUE_LAYER);
          }
          scene.add(cap);
          cap.userData.hoverName = record.hoverMesh.userData.hoverName;
          cap.userData.hoverOf = record.hoverMesh;
          sectionCapObjects.push(cap);
          registerVisibilityObject(record.keys, cap, record.baseVisible);
          const outlineGeometry = new THREE.BufferGeometry();
          outlineGeometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(linePositions, 3),
          );
          const outline = new THREE.LineSegments(
            outlineGeometry,
            new THREE.LineBasicMaterial({
              color: new THREE.Color(
                record.color[0] * EDGE_COLOR_SCALE,
                record.color[1] * EDGE_COLOR_SCALE,
                record.color[2] * EDGE_COLOR_SCALE,
              ),
              depthWrite: false,
              toneMapped: false,
              clippingPlanes: sectionPlanes,
            }),
          );
          outline.layers.set(EDGE_LAYER);
          edgesRoot.add(outline);
          sectionCapObjects.push(outline);
          registerVisibilityObject(record.keys, outline, record.baseVisible);
        });
      }

      [
        ["northSouth", cutNorthSouthInput, cutNorthSouthValue],
        ["eastWest", cutEastWestInput, cutEastWestValue],
      ].forEach(([cut, input, output]) => {
        input.disabled = !sectionCuts[cut].extent;
        input.addEventListener("input", () => {
          sectionCuts[cut].fraction = Number(input.value) / SECTION_CUT_STEPS;
          applySectionCuts();
          output.textContent = formatSectionCutValue(cut);
        });
      });
      applySectionCuts();

      // Transparency: the native weighted blended pass (renderer.cpp render_transparent + composite).
      // Opaque scene -> opaqueTarget, transparent colour -> accumTarget (ONE, ONE),
      // revealage -> revealTarget (ZERO, ONE_MINUS_SRC_COLOR, 8-bit like the native R8 target),
      // then the native composite formula onto the canvas.
      const depthOnlyMaterial = new THREE.MeshBasicMaterial({
        colorWrite: false,
        side: THREE.DoubleSide,
        clippingPlanes: sectionPlanes,
      });
      const compositeMaterial = new THREE.ShaderMaterial({
        uniforms: {
          accumTexture: { value: null },
          revealageTexture: { value: null },
          opaqueTexture: { value: null },
        },
        vertexShader: `
        varying vec2 vTexCoord;
        void main() {
          vTexCoord = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
        fragmentShader: `
        uniform sampler2D accumTexture;
        uniform sampler2D revealageTexture;
        uniform sampler2D opaqueTexture;
        varying vec2 vTexCoord;
        void main() {
          vec4 accum = texture2D(accumTexture, vTexCoord);
          float revealage = texture2D(revealageTexture, vTexCoord).r;
          vec4 opaque = texture2D(opaqueTexture, vTexCoord);
          if (accum.a <= 1e-5) {
            gl_FragColor = opaque;
            return;
          }
          vec3 avgColor = accum.rgb / max(accum.a, 1e-5);
          float transmittance = max(1.0 - revealage, 1e-5);
          vec3 finalColor = avgColor * (1.0 - transmittance) + opaque.rgb * transmittance;
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
        depthTest: false,
        depthWrite: false,
      });
      const compositeScene = new THREE.Scene();
      compositeScene.add(
        new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compositeMaterial),
      );
      const compositeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const transparentTargets = { size: new THREE.Vector2(), ready: false };
      // Without float colour targets the weighted blend cannot run; plain alpha blending is used instead.
      const canWeightedBlend =
        renderer.capabilities.isWebGL2 &&
        (renderer.extensions.has("EXT_color_buffer_float") ||
          renderer.extensions.has("EXT_color_buffer_half_float"));

      function ensureTransparentTargets() {
        const size = renderer.getDrawingBufferSize(new THREE.Vector2());
        if (transparentTargets.ready && transparentTargets.size.equals(size)) {
          return transparentTargets;
        }
        if (transparentTargets.ready) {
          transparentTargets.opaque.dispose();
          transparentTargets.accum.dispose();
          transparentTargets.reveal.dispose();
        }
        const w = Math.max(1, size.x);
        const h = Math.max(1, size.y);
        transparentTargets.opaque = new THREE.WebGLRenderTarget(w, h, {
          samples: renderer.capabilities.isWebGL2 ? 4 : 0,
          type: THREE.UnsignedByteType,
        });
        transparentTargets.accum = new THREE.WebGLRenderTarget(w, h, {
          type: THREE.HalfFloatType,
        });
        transparentTargets.reveal = new THREE.WebGLRenderTarget(w, h, {
          type: THREE.UnsignedByteType,
        });
        transparentTargets.size.copy(size);
        transparentTargets.ready = true;
        return transparentTargets;
      }

      function getVisibleTransparentMeshes() {
        return transparentMeshes.filter((mesh) => mesh.visible === true);
      }

      function renderOpaqueLayers(target) {
        camera.layers.set(OPAQUE_LAYER);
        if (edgesEnabled) camera.layers.enable(EDGE_LAYER);
        renderer.setRenderTarget(target);
        renderer.clear(true, true, true);
        renderer.render(scene, camera);
      }

      function renderTransparentPass(target, materialKey, clearValue) {
        const background = renderer.getClearColor(new THREE.Color());
        const backgroundAlpha = renderer.getClearAlpha();
        renderer.setRenderTarget(target);
        renderer.setClearColor(
          new THREE.Color(clearValue, clearValue, clearValue),
          clearValue,
        );
        renderer.clear(true, true, true);
        camera.layers.set(OPAQUE_LAYER);
        scene.overrideMaterial = depthOnlyMaterial;
        renderer.render(scene, camera);
        scene.overrideMaterial = null;
        transparentMeshes.forEach((mesh) => {
          mesh.material = mesh.userData[materialKey];
        });
        camera.layers.set(TRANSPARENT_LAYER);
        renderer.render(scene, camera);
        renderer.setClearColor(background, backgroundAlpha);
      }

      function renderScene() {
        const previousAutoClear = renderer.autoClear;
        renderer.autoClear = false;
        try {
          if (!getVisibleTransparentMeshes().length) {
            renderOpaqueLayers(null);
            return;
          }
          if (!canWeightedBlend) {
            renderOpaqueLayers(null);
            transparentMeshes.forEach((mesh) => {
              mesh.material = mesh.userData.fallbackMaterial;
            });
            camera.layers.set(TRANSPARENT_LAYER);
            renderer.render(scene, camera);
            return;
          }
          const targets = ensureTransparentTargets();
          renderOpaqueLayers(targets.opaque);
          renderTransparentPass(targets.accum, "accumMaterial", 0.0);
          renderTransparentPass(targets.reveal, "revealageMaterial", 1.0);
          transparentMeshes.forEach((mesh) => {
            mesh.material = mesh.userData.accumMaterial;
          });
          compositeMaterial.uniforms.accumTexture.value = targets.accum.texture;
          compositeMaterial.uniforms.revealageTexture.value =
            targets.reveal.texture;
          compositeMaterial.uniforms.opaqueTexture.value =
            targets.opaque.texture;
          renderer.setRenderTarget(null);
          renderer.clear(true, true, true);
          renderer.render(compositeScene, compositeCamera);
        } finally {
          renderer.setRenderTarget(null);
          renderer.autoClear = previousAutoClear;
          camera.layers.set(OPAQUE_LAYER);
        }
      }
      function updatePdfPlaneForActivePage() {
        const page = getActivePage();
        if (!page) return;
        renderPdfPageCanvas(page).then((off) => {
          if (page.uid !== activePageUid) return;
          if (!off || !(page.pageWidth > 0) || !(page.pageHeight > 0)) {
            if (pdfPlane) {
              pdfPlane.userData.baseVisible = false;
              setRenderedObjectVisible(pdfPlane, false);
            }
            return;
          }
          if (
            !Number.isFinite(page.planeX) ||
            !Number.isFinite(page.planeY) ||
            !Number.isFinite(page.planeZ)
          ) {
            if (pdfPlane) {
              pdfPlane.userData.baseVisible = false;
              setRenderedObjectVisible(pdfPlane, false);
            }
            return;
          }
          const tex = new THREE.CanvasTexture(off);
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          const geo = new THREE.PlaneGeometry(page.pageWidth, page.pageHeight);
          if (!pdfPlane) {
            pdfPlane = new THREE.Mesh(
              geo,
              new THREE.MeshBasicMaterial({
                map: tex,
                side: THREE.DoubleSide,
                toneMapped: false,
              }),
            );
            pdfPlane.rotation.x = -Math.PI / 2;
            pdfPlane.renderOrder = -1;
            pdfPlane.userData.takeoffUid = "";
            scene.add(pdfPlane);
            const pageLayer = sceneData.page_image_layer || {};
            registerVisibilityObject(
              {
                layerUid: pageLayer.uid || page.imageLayerUid,
                layerName: pageLayer.name || IMAGE_LAYER_DISPLAY_NAME,
              },
              pdfPlane,
              true,
            );
          } else {
            if (pdfPlane.geometry) pdfPlane.geometry.dispose();
            if (pdfPlane.material && pdfPlane.material.map)
              pdfPlane.material.map.dispose();
            pdfPlane.geometry = geo;
            pdfPlane.material.map = tex;
            pdfPlane.material.toneMapped = false;
            pdfPlane.material.needsUpdate = true;
            const pageLayer = sceneData.page_image_layer || {};
            pdfPlane.userData.layerUid = normalizeLayerUid(
              pageLayer.uid || page.imageLayerUid,
            );
            pdfPlane.userData.conditionUid = "";
            pdfPlane.userData.areaUid = "";
            pdfPlane.userData.usesPage3dVisibility = false;
            pdfPlane.userData.baseVisible = true;
          }
          pdfPlane.position.set(page.planeX, page.planeY, page.planeZ);
          const uv = geo.attributes.uv;
          for (let i = 0; i < uv.count; i++) {
            if (page.planeFlipU) uv.setX(i, 1 - uv.getX(i));
            if (page.planeFlipV) uv.setY(i, 1 - uv.getY(i));
          }
          uv.needsUpdate = true;
          setRenderedObjectVisible(pdfPlane, isObjectVisible(pdfPlane));
        });
      }

      buildLayerPanel();
      buildPageCombo();
      renderActivePlanPage(true);
      updatePdfPlaneForActivePage();

      // Hover info: the element under the pointer, or the navigation hint. A
      // pointer move only stores its position; animate() picks at most once per
      // frame, and nothing runs while the pointer is still. Picking follows the
      // native rules: hidden objects and the cut-away side are skipped, caps and
      // cranes can be named.
      const hoverRaycaster = new THREE.Raycaster();
      hoverRaycaster.layers.enableAll();
      const hoverState = { pending: null, tap: null };

      function isShownInScene(object) {
        for (let node = object; node; node = node.parent) {
          if (!node.visible) return false;
        }
        return true;
      }

      function sectionCutRemovesPoint(point) {
        const cut = sectionCutUniform.value;
        return (
          (cut.x > 0.5 && point.z < cut.y) || (cut.z > 0.5 && point.x > cut.w)
        );
      }

      function firstHoverHit(intersections) {
        for (const hit of intersections) {
          const data = hit.object.userData || {};
          if (!data.hoverName) continue;
          if (!isShownInScene(hit.object)) continue;
          if (sectionCutRemovesPoint(hit.point)) continue;
          return hit;
        }
        return null;
      }

      // Plan area (SF) and volume (CF) of an element's mesh (scene inches); both
      // need a closed mesh and are null otherwise. The elevations come formatted
      // by the app (geometries[].hover_bottom / hover_top), as the callouts.
      function elementHoverStats(positions, index) {
        const count = index.length - (index.length % 3);
        if (!count) return null;
        const point = (i) => [
          positions[i * 3],
          positions[i * 3 + 1],
          positions[i * 3 + 2],
        ];
        const edgeUses = new Map();
        const keyOf = (i) =>
          [0, 1, 2]
            .map((k) => Math.round(positions[i * 3 + k] * 1000))
            .join(",");
        let projected = 0;
        let volume6 = 0;
        for (let t = 0; t < count; t += 3) {
          const ids = [index[t], index[t + 1], index[t + 2]];
          const [a, b, c] = ids.map(point);
          const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
          const v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
          projected += Math.abs(u[2] * v[0] - u[0] * v[2]) / 2;
          volume6 +=
            a[0] * (b[1] * c[2] - b[2] * c[1]) -
            a[1] * (b[0] * c[2] - b[2] * c[0]) +
            a[2] * (b[0] * c[1] - b[1] * c[0]);
          for (let e = 0; e < 3; e++) {
            const ka = keyOf(ids[e]);
            const kb = keyOf(ids[(e + 1) % 3]);
            if (ka === kb) continue;
            const key = ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
            edgeUses.set(key, (edgeUses.get(key) || 0) + 1);
          }
        }
        const closed = Array.from(edgeUses.values()).every(
          (uses) => uses % 2 === 0,
        );
        return {
          areaSf: closed && projected > 0 ? projected / 2 / 144 : null,
          volumeCf:
            closed && volume6 !== 0 ? Math.abs(volume6) / 6 / 1728 : null,
        };
      }

      function escapeHtml(text) {
        return String(text).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      // Line 1: the condition name. Line 2: elevations, plan area and volume,
      // three spaces apart; a missing value leaves its field out. Null means the
      // navigation hint.
      function hoverTipHtml(info) {
        if (!info || !info.name) return null;
        const fields = [];
        if (info.bottom) fields.push(`BOTTOM EL ${info.bottom}`);
        if (info.top) fields.push(`TOP EL ${info.top}`);
        if (Number.isFinite(info.areaSf)) {
          fields.push(
            `${info.areaSf.toLocaleString(undefined, { maximumFractionDigits: 1 })} SF`,
          );
        }
        if (Number.isFinite(info.volumeCf)) {
          fields.push(`${(info.volumeCf / 27).toFixed(1)} CY`);
        }
        const name = `<b>${escapeHtml(info.name)}</b>`;
        return fields.length
          ? `${name}<span>${escapeHtml(fields.join("   "))}</span>`
          : name;
      }

      // Elements carry their stats (computed once); caps use their element's;
      // cranes show the condition name only.
      function hoverInfo(hit) {
        if (!hit) return null;
        const data = hit.object.userData;
        const source = data.hoverOf || hit.object;
        const geometry = source.userData.hoverGeometry;
        if (geometry && source.userData.hoverStats === undefined) {
          source.userData.hoverStats = elementHoverStats(
            geometry.positions,
            geometry.index,
          );
        }
        return Object.assign(
          {
            name: data.hoverName,
            bottom: source.userData.hoverBottom,
            top: source.userData.hoverTop,
          },
          source.userData.hoverStats || {},
        );
      }

      function showHoverTip(hit) {
        const html = hoverTipHtml(hoverInfo(hit));
        if (html === null) viewTip.textContent = TIP_3D;
        else viewTip.innerHTML = html;
      }

      function updateHoverTip(pointer) {
        if (document.body.classList.contains("plan-mode")) return;
        const rect = canvas.getBoundingClientRect();
        if (!(rect.width > 0) || !(rect.height > 0)) return;
        const ndc = new THREE.Vector2(
          ((pointer.x - rect.left) / rect.width) * 2 - 1,
          -((pointer.y - rect.top) / rect.height) * 2 + 1,
        );
        hoverRaycaster.setFromCamera(ndc, camera);
        const targets = hoverMeshes.concat(
          sectionCapObjects.filter((object) => object.isMesh),
        );
        showHoverTip(
          firstHoverHit(hoverRaycaster.intersectObjects(targets, false)),
        );
      }

      canvas.addEventListener("pointermove", (event) => {
        if (event.pointerType === "touch" || event.buttons) return;
        hoverState.pending = { x: event.clientX, y: event.clientY };
      });
      canvas.addEventListener("pointerleave", (event) => {
        if (event.pointerType === "touch") return;
        hoverState.pending = null;
        if (!document.body.classList.contains("plan-mode")) {
          viewTip.textContent = TIP_3D;
        }
      });
      // Touch: a tap names the element under it; a tap on empty space shows the
      // hint again. Drags and pinches are not taps.
      canvas.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "touch") return;
        hoverState.tap = event.isPrimary
          ? { x: event.clientX, y: event.clientY, time: performance.now() }
          : null;
      });
      canvas.addEventListener("pointerup", (event) => {
        const tap = hoverState.tap;
        if (event.pointerType !== "touch" || !tap || !event.isPrimary) return;
        hoverState.tap = null;
        const moved = Math.hypot(event.clientX - tap.x, event.clientY - tap.y);
        if (moved <= 8 && performance.now() - tap.time < 500) {
          hoverState.pending = { x: event.clientX, y: event.clientY };
        }
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        updateCameraClipping();
        if (sectionCapsDirty) {
          sectionCapsDirty = false;
          rebuildSectionCaps();
        }
        if (hoverState.pending) {
          const pointer = hoverState.pending;
          hoverState.pending = null;
          updateHoverTip(pointer);
        }
        renderScene();
      }

      function resizeViewport() {
        const width = getViewportWidth();
        const height = getViewportHeight();
        camera.aspect = width / height;
        updateCameraClipping(true);
        renderer.setSize(width, height, false);
        fitPlanToViewport(false);
      }

      if (typeof ResizeObserver === "function") {
        new ResizeObserver(resizeViewport).observe(viewport);
      }
      window.addEventListener("resize", resizeViewport);

      animate();
    </script>
  </body>
</html>
